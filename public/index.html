// --- Planning groups ---------------------------------------------------------
// A planning group pools product types the customer treats as interchangeable:
// solid vs printed, and the silhouettes a fashion season rotates through (slim
// vs wide leg). Buys and over/under NET within a group before anything is called
// a "buy" - a top a shopper can't find in one type she just buys in another.
// Shopify product types are never touched; this is a planning layer on top.
const DEFAULT_GROUP_OF = {
  // Tops: Fashion Tops + both Tees/Tunics all read as "a top" to the customer
  "1100 Fashion Tops": "Tops", "1101 Tees/Tunics Solid": "Tops", "1102 Tees/Tunics Printed": "Tops",
  // Tanks: solid + printed
  "1103 Tanks Solid": "Tanks", "1104 Tanks Printed": "Tanks",
  // Blouses: solid + printed (kept separate from Tops on purpose)
  "1105 Blouses/Shirts Solid": "Blouses", "1106 Blouses/Shirts Printed": "Blouses",
  // Pants: every silhouette the trend rotates through - NOT tights/skirts/shorts
  "3101 Bootcut Pants": "Pants", "3102 Flare Pants": "Pants", "3103 Wide Leg Pants": "Pants",
  "3104 Jogger Pants": "Pants", "3105 Slim Leg Pants": "Pants", "3106 Straight Pants": "Pants",
  "3110 Fashion Pant": "Pants",
  // Dresses: solid + printed
  "4101 Solid Dresses": "Dresses", "4102 Printed Dresses": "Dresses",
  // Jumpsuits: solid + printed
  "4103 Solid Jumpsuits": "Jumpsuits", "4104 Printed Jumpsuits": "Jumpsuits",
};
// Anything not listed above falls back to its own category as its group, so the
// default is "category-level, but with Tops merged and Pants split out from the
// tights/skirts/shorts basics." Everything is editable in the Groups panel.
function defaultPlanGroups() {
  const m = {};
  TAXONOMY.forEach(([type, cat]) => { m[type] = DEFAULT_GROUP_OF[type] || cat; });
  return m;
}

}

function monthLabel(key) { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "2-digit" }); }
function next12Months() { const out = []; const now = new Date(); now.setDate(1); for (let i = 0; i < 12; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); out.push(monthKey(d)); } return out; }
function money(n) { if (n === null || n === undefined) return "—"; const v = Number(n) || 0; return v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }); }

function emptyRow() {

// ---- tiny inline bar chart (no chart library needed) ----
function MiniBarChart({ data }) {
  const w = 600, h = 130, padL = 44, padB = 18, padT = 8;
  const vals = data.map((d) => d.value);
  const maxAbs = Math.max(1, ...vals.map((v) => Math.abs(v)));
  const zeroY = padT + (h - padT - padB) * 0.5;
  const scale = (h - padT - padB) / 2 / maxAbs;
  const barW = (w - padL - 10) / data.length - 6;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height: 130 }}>
      <line x1={padL} y1={zeroY} x2={w - 5} y2={zeroY} stroke="#C4B9A0" strokeWidth="1" />
      {data.map((d, i) => {
        const x = padL + i * ((w - padL - 10) / data.length) + 3;
        const barH = Math.abs(d.value) * scale;
        const y = d.value >= 0 ? zeroY - barH : zeroY;
        return (
          <g key={i}>
            <rect x={x} y={y} width={Math.max(barW, 2)} height={Math.max(barH, 1)} fill="#C99A3C" rx="2" />
            <text x={x + barW / 2} y={h - 4} fontSize="9" fill="#8B8F98" textAnchor="middle" fontFamily="IBM Plex Mono, monospace">{d.month}</text>
          </g>
        );
      })}
      <text x={2} y={zeroY + 3} fontSize="9" fill="#8B8F98" fontFamily="IBM Plex Mono, monospace">$0</text>
    </svg>
  );
}

function OTBEngine() {
  const months = useMemo(() => next12Months(), []);
  const [assumptions, setAssumptions] = useState({});
  const [startingBOM, setStartingBOM] = useState({});
  const [data, setData] = useState({});
  const [expandedType, setExpandedType] = useState(null);
  const [monthCursor, setMonthCursor] = useState(0);
  const [scrollStart, setScrollStart] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [filterSelection, setFilterSelection] = useState("all");
  const [viewMode, setViewMode] = useState("type"); // "type" | "category" | "group"
  const [planGroups, setPlanGroups] = useState(defaultPlanGroups()); // { [type]: groupName }
  const [showGroups, setShowGroups] = useState(false);
  const [expandedGroup, setExpandedGroup] = useState(null);
  const [metric, setMetric] = useState("overUnder");
  const [showImport, setShowImport] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [growthSuggestions, setGrowthSuggestions] = useState({});
  const [suggestionsStatus, setSuggestionsStatus] = useState("");
  const [calculatingSuggestions, setCalculatingSuggestions] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [showVendors, setShowVendors] = useState(false);
  const [showMonthPace, setShowMonthPace] = useState(false);
  // --- Buy Board -------------------------------------------------------------
  const [showBuyBoard, setShowBuyBoard] = useState(false);
  const [buyView, setBuyView] = useState("month");     // "month" = one month in detail, "season" = all 12
  const [buyBy, setBuyBy] = useState("group");         // rows: planning group, or Shopify category
  const [useTrend, setUseTrend] = useState(true);
  const [coverOverride, setCoverOverride] = useState("");   // blank = derive from lead time
  const [expandedPaceCat, setExpandedPaceCat] = useState(null);
  const [dailySales, setDailySales] = useState({}); // { "YYYY-MM-DD": netSalesAmount } - imported via CSV, since Shopify's live Admin API only reaches back ~60 days, too short to pull LY comparisons directly.
  const [liveInventory, setLiveInventory] = useState(null); // { totals: {type: {units, value}}, loadedAt } - snapshot for Month Pace's Weeks of Stock column, loaded via CSV import (see "Import current stock" - a live per-variant API pull was tried first but proved too slow/unreliable for a large multi-location catalog).
  const [vendorTable, setVendorTable] = useState(null); // { vendor: { mStr: {sales, cogs, actualMarginPct, plannedMarginPct, marginDiff} } }
  const [vendorMonths, setVendorMonths] = useState([]); // array of "YYYY-MM" strings, loaded range
  const [vendorStatus, setVendorStatus] = useState("");
  const [loadingVendors, setLoadingVendors] = useState(false);
  const [vendorSort, setVendorSort] = useState("sales");
  const [vendorMetric, setVendorMetric] = useState("sales"); // which metric fills the month columns
  const [vendorMonthOffset, setVendorMonthOffset] = useState(0); // 0 = current month, negative = past, positive = future - this is the END of the loaded range
  const [vendorRangeSize, setVendorRangeSize] = useState(6); // how many months back from the offset to load
  const [syncStatus, setSyncStatus] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [importText, setImportText] = useState("");
  const [importPreview, setImportPreview] = useState(null);
  const [importError, setImportError] = useState("");
  const [importFormat, setImportFormat] = useState("generic");
  const [importSummary, setImportSummary] = useState("");
  const fileInputRef = useRef(null);
  const visibleMonths = 6;

  useEffect(() => {
    (async () => {
      let loadedFromServer = false;
      try {
        const res = await fetch("/state").then((r) => r.json());
        if (res.error) throw new Error(res.error);
        if (res.value) {
          const parsed = JSON.parse(res.value);
          setAssumptions(parsed.assumptions || {});
          setStartingBOM(parsed.startingBOM || {});
          setData(parsed.data || {});
          setDailySales(parsed.dailySales || {});
          setPlanGroups(parsed.planGroups && Object.keys(parsed.planGroups).length ? parsed.planGroups : defaultPlanGroups());
          if (parsed.liveInventory) setLiveInventory({ ...parsed.liveInventory, loadedAt: parsed.liveInventory.loadedAt ? new Date(parsed.liveInventory.loadedAt) : new Date() });
          if (parsed.coverOverride !== undefined) setCoverOverride(parsed.coverOverride);
          if (parsed.useTrend !== undefined) setUseTrend(parsed.useTrend);
          loadedFromServer = true;
        }
      } catch (e) { /* server unreachable or not configured yet - fall through to local copy below */ }
      if (!loadedFromServer) {
        // Nothing on the server yet (new database, or server unreachable) - load whatever this
        // browser has locally. If the server is up, the next autosave will push this data to it.
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            setAssumptions(parsed.assumptions || {});
            setStartingBOM(parsed.startingBOM || {});
            setData(parsed.data || {});
            setDailySales(parsed.dailySales || {});
            setPlanGroups(parsed.planGroups && Object.keys(parsed.planGroups).length ? parsed.planGroups : defaultPlanGroups());
            if (parsed.liveInventory) setLiveInventory({ ...parsed.liveInventory, loadedAt: parsed.liveInventory.loadedAt ? new Date(parsed.liveInventory.loadedAt) : new Date() });
            if (parsed.coverOverride !== undefined) setCoverOverride(parsed.coverOverride);
            if (parsed.useTrend !== undefined) setUseTrend(parsed.useTrend);
          }
        } catch (e2) { /* first run, nothing anywhere yet */ }
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    const t = setTimeout(async () => {
      const payload = { assumptions, startingBOM, data, dailySales, planGroups, liveInventory, coverOverride, useTrend };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); // always keep a local backup copy too
      } catch (e) { /* ignore quota errors */ }
      try {
        const res = await fetch("/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then((r) => r.json());
        setSaveState(res.ok ? "saved" : "saved locally only");
      } catch (e) { setSaveState("saved locally only"); }
    }, 400);
    return () => clearTimeout(t);
  }, [assumptions, startingBOM, data, dailySales, planGroups, liveInventory, coverOverride, useTrend, loaded]);

  function getAssumptions(cat) { return assumptions[cat] || defaultAssumptions(); }
  function setAssumption(cat, patch) { setAssumptions((prev) => ({ ...prev, [cat]: { ...getAssumptions(cat), ...patch } })); }
  function getRow(type, mKey) { return (data[type] && data[type][mKey]) || emptyRow(); }
  function setRow(type, mKey, patch) {
    setData((prev) => {
      const typeData = { ...(prev[type] || {}) };
      typeData[mKey] = { ...(typeData[mKey] || emptyRow()), ...patch };
      return { ...prev, [type]: typeData };
    });
  }

  function computeSeries(type, cat) {
    const a = getAssumptions(cat);
    const growth = a.growthPct / 100;
    const gm = a.gmPct / 100;
    const wos = a.wosTarget;
    const start = num(startingBOM[type]);

    // Pass 1: forecast sales/COGS per month (independent of the BOM roll-forward chain,
    // so we can look ahead when computing a forward-looking WOS target).
    const forecasts = months.map((mKey) => {
      const row = getRow(type, mKey);
      const forecastSales = num(row.lySales) * (1 + growth);
      const forecastCOGS = forecastSales * (1 - gm);
      return { forecastSales, forecastCOGS };
    });
    const WEEKS_PER_MONTH = 4.33;
    // WOS Target EOM $ at month t = the COGS you need to be covered for once month
    // t has finished: `wos` weeks of forecast starting at month t+1, prorating the
    // final partial month.
    //
    // Two corrections live here, both found by rebuilding this model in a spreadsheet.
    //
    // 1. START AT t+1, NOT t. The value this is compared against (targetEOM) is stock
    //    at the END of month t, by which point month t's own sales have already gone.
    //    Summing from t asked you to still be holding August's sales after August had
    //    sold them, which inflated every buy by roughly the difference between the
    //    month entering the window and the one leaving it.
    //
    // 2. WRAP AROUND THE YEAR. The window used to stop dead at the edge of the visible
    //    12 months, so the last months' targets were understated by construction and
    //    read as "nothing to buy" - June came out at $0 when it was really the second
    //    biggest buy of the year. The retail year is a cycle: June's cover is
    //    Jun+Jul+Aug, and August is right there at the start of the grid. Wrapped
    //    months get another year of growth applied and are flagged as estimated,
    //    because their basis is a year further back than everything else.
    function wosTargetAt(t) {
      const n = forecasts.length;
      let weeksLeft = wos, total = 0, idx = t + 1, weeksFound = 0, wrapped = false;
      while (weeksLeft > 0) {
        const lap = Math.floor(idx / n);
        if (lap > 0) wrapped = true;
        const take = Math.min(weeksLeft, WEEKS_PER_MONTH);
        total += forecasts[idx % n].forecastCOGS * Math.pow(1 + growth, lap) * (take / WEEKS_PER_MONTH);
        weeksLeft -= take;
        weeksFound += take;
        idx++;
      }
      return { total, weeksFound, wrapped };
    }

    let actualBOMChain = start;
    let prevTargetEOM = null;
    let prevWosTarget = null;
    const out = [];
    months.forEach((mKey, t) => {
      const row = getRow(type, mKey);
      const forecastSales = forecasts[t].forecastSales;
      const forecastCOGS = forecasts[t].forecastCOGS;
      const expected = num(row.received) + num(row.balanceToReceive);
      const hasActualsThisMonth = row.actualSales !== "" && row.actualSales !== undefined;
      const actualBOMForThisMonth = t === 0 ? start : actualBOMChain;

      let basis, basisSource;
      if (row.targetBOMOverride !== "" && row.targetBOMOverride !== undefined) { basis = num(row.targetBOMOverride); basisSource = "target override"; }
      else if (row.actualBOMOverride !== "" && row.actualBOMOverride !== undefined) { basis = num(row.actualBOMOverride); basisSource = "actual override"; }
      else if (t === 0) { basis = start; basisSource = "starting BOM"; }
      else if (hasActualsThisMonth) { basis = actualBOMForThisMonth; basisSource = "actual (rolled)"; }
      else { basis = prevTargetEOM; basisSource = "target (rolled)"; }

      const targetEOM = basis + expected - forecastCOGS;
      const wos_ = wosTargetAt(t);
      const wosTargetEOM = wos_.total;
      // No longer "short" - the window always fills now. Flagged instead when part
      // of it wrapped past the end of the year and is therefore estimated.
      const wosEstimated = wos_.wrapped;
      const overUnder = wosTargetEOM - targetEOM;
      const buyAction = overUnder > 0 ? "Buy" : overUnder < 0 ? "Don't Buy" : "On Target";

      // --- Buy Plan -------------------------------------------------------
      // Over/Under is a CUMULATIVE gap: the roll-forward chain above never adds
      // back any recommended buy, so it answers "how far short will I be at EOM
      // if I order nothing from here." That is not the number you write a cheque
      // for at market. Buy Plan is the incremental one: assume you bought to the
      // cover target in every prior month, then ask what this month needs.
      //
      // Held UNFLOORED here on purpose. A group must be able to net a type that
      // is over against one that is short before anything is called a buy - the
      // same reason the headline totals net inside a group. Flooring happens once,
      // at the aggregate, in buyPlanForTypes.
      //
      // A BOM override is an explicit statement about planned inventory (e.g. a
      // deliberate sell-down glide path), so it re-anchors the plan chain; every
      // other month starts from the previous month's cover target, which is where
      // buying to plan would have left it.
      const isOverride = basisSource === "target override" || basisSource === "actual override";
      const planBOMPrev = t === 0 || isOverride ? basis : prevWosTarget;
      const buyRaw = wosTargetEOM - (planBOMPrev + expected - forecastCOGS);

      out.push({ mKey, row, forecastSales, forecastCOGS, expected, basis, basisSource, targetEOM, wosTargetEOM, wosEstimated, overUnder, buyAction, buyRaw });
      actualBOMChain = actualBOMForThisMonth - num(row.actualCogs) + num(row.received);
      prevTargetEOM = targetEOM;
      prevWosTarget = wosTargetEOM;
    });
    return out;
  }

  const seriesByType = useMemo(() => {
    const m = {};
    TAXONOMY.forEach(([type, cat]) => { m[type] = computeSeries(type, cat); });
    return m;
  }, [data, assumptions, startingBOM, months]);

  // Planning groups: ordered list of group names + the types in each, derived
  // from the type->group map. A type with a blank assignment stands alone.
  const groupNames = useMemo(() => {
    const seen = [];
    TAXONOMY.forEach(([type]) => { const g = planGroups[type] || type; if (!seen.includes(g)) seen.push(g); });
    return seen;
  }, [planGroups]);
  const typesByGroup = useMemo(() => {
    const m = {};
    TAXONOMY.forEach(([type]) => { const g = planGroups[type] || type; (m[g] = m[g] || []).push(type); });
    return m;
  }, [planGroups]);
  // Over/under for a set of types in a given month = plain sum (it aggregates
  // linearly), which is exactly the point: an overstocked type nets against a
  // needed buy inside the same group before we floor at zero.
  function groupOverUnderAt(types, monthIdx) {
    return types.reduce((sum, t) => sum + seriesByType[t][monthIdx].overUnder, 0);
  }

  // Buy Plan for a set of types, across all 12 months.
  //
  // Two things have to happen in this order, and the order is the whole trick:
  //   1. SUM the unfloored per-type buys, so an over-bought type nets against a
  //      short one inside the same group. Flooring per type first would re-inflate
  //      the buy exactly the way the old Math.max(overUnder,0) per type did.
  //   2. THEN floor at zero month by month, carrying any surplus forward. The
  //      carry matters: receipts landing in one month that overshoot its target
  //      are real inventory that reduces the NEXT month's cheque. Flooring without
  //      carrying would bill the following month in full and overstate the season.
  const buyPlanCache = useMemo(() => new Map(), [seriesByType]);
  function buyPlanForTypes(types) {
    const key = types.join("|");
    const hit = buyPlanCache.get(key);
    if (hit) return hit;
    const out = [];
    let carry = 0;
    for (let t = 0; t < months.length; t++) {
      const avail = types.reduce((sum, ty) => sum + seriesByType[ty][t].buyRaw, 0) + carry;
      out.push(Math.max(0, avail));
      carry = Math.min(0, avail);
    }
    buyPlanCache.set(key, out);
    return out;
  }
  // A month is flagged when its cover window ran past the end of the 12-month
  // horizon for any member type, so its buy is understated by construction.
  function buyPlanShortAt(types, monthIdx) {
    return types.some((t) => seriesByType[t][monthIdx].wosEstimated);
  }
  // Total across the months currently on screen - the market budget.
  function buyPlanWindowTotal(types) {
    return buyPlanForTypes(types).slice(scrollStart, scrollStart + visibleMonths).reduce((a, b) => a + b, 0);
  }
  // The TOTAL row must not net across the rows above it. Netting is only ever
  // legitimate inside one planning bucket - a shopper substitutes a tee for a
  // blouse, she does not substitute boots for a tee - so pooling all 61 types
  // into one set would let footwear overstock silently fund a tops buy and
  // report a budget well below the sum of what you actually have to write.
  // Instead the total re-buckets by whatever the grid is currently showing, so
  // TOTAL always equals the sum of the visible rows.
  function buyPlanRowSets(types) {
    if (viewMode === "group") {
      const m = {};
      types.forEach((t) => { const g = planGroups[t] || t; (m[g] = m[g] || []).push(t); });
      return Object.values(m);
    }
    if (viewMode === "category") {
      const m = {};
      types.forEach((t) => { const c = CATEGORY_OF[t] || t; (m[c] = m[c] || []).push(t); });
      return Object.values(m);
    }
    return types.map((t) => [t]);
  }
  function buyPlanTotalAt(types, monthIdx) {
    return buyPlanRowSets(types).reduce((sum, set) => sum + buyPlanForTypes(set)[monthIdx], 0);
  }
  function buyPlanTotalWindow(types) {
    return buyPlanRowSets(types).reduce((sum, set) => sum + buyPlanWindowTotal(set), 0);
  }

  // ===== Buy Board ==========================================================
  // One screen that answers "it is <month> - how much do I write?"
  //
  // It differs from the grid's Buy Plan in two ways, both of which came out of
  // planning August and finding the number was not load-bearing:
  //   1. FORECAST FOLLOWS REALITY. The grid forecasts last year x growth%. If the
  //      season is running 20% under that, every buy downstream is inflated. Here
  //      the forecast is scaled by how the current month is actually selling.
  //   2. COVER IS DERIVED, NOT GUESSED. Weeks of cover is not a preference - it is
  //      lead time + how often you re-plan + a safety buffer. A 4-week tee vendor
  //      needs ~10 weeks of cover; a 12-week dress vendor needs ~18. One flat number
  //      across every category is wrong in both directions at once.
  const TREND_DECAY = 0.7;    // how fast the current month's read stops applying to later months

  const buyBoard = useMemo(() => {
    const WPM = 4.33;
    const curM = months[0];
    if (!curM || !months[monthCursor]) return null;
    const [cy, cm] = curM.split("-").map(Number);
    const totalDays = new Date(cy, cm, 0).getDate();
    const today = new Date();
    const isCur = today.getFullYear() === cy && today.getMonth() + 1 === cm;
    const daysElapsed = isCur ? today.getDate() : totalDays;
    const dp = computeDailyPaceRatio(curM, daysElapsed);
    const paceRatio = dp.complete ? dp.ratio : daysElapsed / totalDays;

    // Trend, measured per CATEGORY - a single product type is too noisy to steer a buy.
    // Needs real dollars behind it, and is clamped: one soft fortnight must not be
    // allowed to rewrite a whole season.
    const trendByCat = {};
    let storeAct = 0, storeExp = 0;
    CATEGORIES.forEach((c) => {
      let act = 0, exp = 0, seen = 0;
      (TYPES_BY_CATEGORY[c] || []).forEach((t) => {
        const r = getRow(t, curM);
        if (r.actualSales === "" || r.actualSales === undefined) return;
        act += num(r.actualSales);
        exp += num(r.lySales) * (1 + getAssumptions(c).growthPct / 100) * paceRatio;
        seen++;
      });
      trendByCat[c] = (seen > 0 && exp > 250) ? Math.max(0.6, Math.min(1.4, act / exp)) : null;
      if (seen > 0 && exp > 250) { storeAct += act; storeExp += exp; }
    });
    // The honest store-level read: dollars actually sold vs dollars the plan expected
    // by now, weighted by size. This is "how the season is running" - NOT the ratio of
    // one buy total to another, which is a far larger number for reasons that have
    // nothing to do with selling (see TREND_DECAY below).
    const storeTrend = storeExp > 250 ? storeAct / storeExp : null;

    // Cover weeks: the group takes its own category's WOS setting from the
    // Assumptions panel, unless the on-screen box overrides it. There is no
    // lead-time model here on purpose - how fast a vendor ships is something the
    // buyer knows and the software would only get wrong. This screen answers one
    // question: how much am I short for this month.
    function coverFor(types) {
      const ov = num(coverOverride);
      if (ov) return { weeks: ov, source: "override" };
      const w = types.length ? getAssumptions(CATEGORY_OF[types[0]]).wosTarget : 12;
      return { weeks: w, source: "assumptions" };
    }

    // Same floor-and-carry plan as the grid metric, but on the group's aggregate with
    // its own cover weeks and the trend-adjusted forecast.
    function seriesForGroup(types, coverWeeks, trendOn) {
      // Growth for the wrapped year. Groups can span categories, so take the first
      // member's - growth is on the same default everywhere, and the wrapped months
      // are an estimate regardless.
      const GROWTH_FALLBACK = (getAssumptions(CATEGORY_OF[types[0]]) || { growthPct: 3 }).growthPct / 100;
      // Trend fades with distance. Three weeks of August is decent evidence about
      // September and nearly worthless about next May, so the adjustment decays toward
      // neutral rather than scaling the whole year by one partial month's read.
      const fc = months.map((m, i) => types.reduce((sum, t) => {
        const a = getAssumptions(CATEGORY_OF[t]);
        const raw = trendByCat[CATEGORY_OF[t]];
        const tf = trendOn && raw != null ? 1 + (raw - 1) * Math.pow(TREND_DECAY, i) : 1;
        return sum + num(getRow(t, m).lySales) * (1 + a.growthPct / 100) * tf * (1 - a.gmPct / 100);
      }, 0));
      const onOrder = months.map((m) => types.reduce((s, t) => { const r = getRow(t, m); return s + num(r.received) + num(r.balanceToReceive); }, 0));
      // Same window as the grid: starts the month AFTER the one being planned, and
      // wraps around the year rather than stopping at the edge of the grid.
      function wosAt(t) {
        const n = fc.length;
        let left = coverWeeks, tot = 0, i = t + 1, wrapped = false;
        while (left > 0) {
          const lap = Math.floor(i / n);
          if (lap > 0) wrapped = true;
          const take = Math.min(left, WPM);
          tot += fc[i % n] * Math.pow(1 + GROWTH_FALLBACK, lap) * (take / WPM);
          left -= take; i++;
        }
        return { tot, wrapped };
      }
      let bom = types.reduce((s, t) => s + num(startingBOM[t]), 0);
      return months.map((m, t) => {
        const w = wosAt(t);
        const before = bom + onOrder[t] - fc[t];
        // net is the honest position: positive = short by this much, negative = over
        // by this much. buy is net floored at zero, because you cannot un-buy stock.
        // Rolling `bom` on the floored buy is what carries a surplus into next month.
        const net = w.tot - before;
        const buy = Math.max(0, net);
        bom = before + buy;
        return { m, net, buy, cogs: fc[t], onOrder: onOrder[t], target: w.tot, short: w.wrapped };
      });
    }

    const idx = monthCursor;
    // Rows are planning groups by default. Category view exists because that is how
    // vendors, budgets and the outside world are organised - but note it nets less:
    // Fashion Tops and Tee/Tunic can offset each other as one Tops group and cannot
    // as two categories, which is worth real money over a year.
    const rowSets = buyBy === "category"
      ? CATEGORIES.map((c) => ({ name: c, types: TYPES_BY_CATEGORY[c] || [] }))
      : groupNames.map((g) => ({ name: g, types: typesByGroup[g] || [] }));
    const rows = rowSets.map(({ name: g, types }) => {
      const cover = coverFor(types);
      const full = seriesForGroup(types, cover.weeks, useTrend);
      const s = full[idx];
      const rawRow = seriesForGroup(types, cover.weeks, false)[idx];
      const cats = [...new Set(types.map((t) => CATEGORY_OF[t]))];
      const tvals = cats.map((c) => trendByCat[c]).filter((x) => x != null);
      const trend = tvals.length ? tvals.reduce((a, b) => a + b, 0) / tvals.length : null;
      const sens = [6, 8, 10, 12].map((w) => ({ w, buy: seriesForGroup(types, w, useTrend)[idx].buy }));
      return { g, types, cover, trend, buy: s.buy, net: s.net, rawBuy: rawRow.buy, cogs: s.cogs, onOrder: s.onOrder,
               target: s.target, short: s.short, sens,
               allBuys: full.map((x) => x.buy), allNet: full.map((x) => x.net), allShort: full.map((x) => x.short) };
    }).filter((r) => r.types.length);

    return {
      rows,
      total: rows.reduce((a, r) => a + r.buy, 0),
      over: rows.reduce((a, r) => a + Math.min(0, r.net), 0),
      rawTotal: rows.reduce((a, r) => a + r.rawBuy, 0),
      mStr: months[idx],
      isPast: idx === 0 && isCur,
      paceRatio, weekdayMatched: dp.complete, daysElapsed, totalDays, storeTrend,
      anyTrend: Object.values(trendByCat).some((x) => x != null),
    };
  }, [data, assumptions, startingBOM, months, planGroups, groupNames, typesByGroup, coverOverride, useTrend, buyBy, monthCursor, dailySales]);

  // Month Pace: for the current real-world month (months[0]), compares actual sales/COGS-to-date
  // against where we'd expect to be given the forecast and how far through the calendar month we are.
  // Answers "is this overperforming plan enough that I should reorder now, before I miss the sale."
  const monthPace = useMemo(() => {
    const mStr = months[0];
    if (!mStr) return null;
    const [y, m] = mStr.split("-").map(Number);
    const totalDays = new Date(y, m, 0).getDate();
    const today = new Date();
    const isActualCurrentMonth = today.getFullYear() === y && today.getMonth() + 1 === m;
    const daysElapsed = isActualCurrentMonth ? today.getDate() : totalDays;
    const pctElapsed = daysElapsed / totalDays;

    const dailyPace = computeDailyPaceRatio(mStr, daysElapsed);
    const usingWeekdayMatch = dailyPace.complete;

    const rows = {};
    TAXONOMY.forEach(([type, cat]) => {
      const a = getAssumptions(cat);
      const growth = a.growthPct / 100;
      const gmAssumption = a.gmPct; // already a %, e.g. 55
      const row = getRow(type, mStr);

      const lySales = num(row.lySales), lyCogs = num(row.lyCogs);
      const forecastRetail = lySales * (1 + growth);
      const forecastCost = forecastRetail * (1 - gmAssumption / 100);

      // Applies one store-wide weekday-matched pacing ratio (from imported daily sales) to each
      // row's own forecast - a deliberate simplification, since we only have daily granularity
      // store-wide, not per Product Type. Falls back to flat "% of days elapsed" if the daily
      // import doesn't fully cover both the comparison window and the full LY month.
      const ratio = usingWeekdayMatch ? dailyPace.ratio : pctElapsed;
      const expectedRetail = forecastRetail * ratio;
      const expectedCost = forecastCost * ratio;

      const hasActuals = row.actualSales !== "" && row.actualSales !== undefined;
      const actualRetail = hasActuals ? num(row.actualSales) : null;
      const actualCost = hasActuals ? num(row.actualCogs) : null;

      const diffRetail = actualRetail === null ? null : actualRetail - expectedRetail;
      const diffCost = actualCost === null ? null : actualCost - expectedCost;

      const plannedMarginGM = gmAssumption; // %
      const plannedMarginLY = lySales > 0 ? ((lySales - lyCogs) / lySales) * 100 : null;
      const actualMarginPct = (actualRetail !== null && actualRetail > 0 && actualCost !== null)
        ? ((actualRetail - actualCost) / actualRetail) * 100 : null;
      const diffVsGM = actualMarginPct === null ? null : actualMarginPct - plannedMarginGM;
      const diffVsLY = (actualMarginPct === null || plannedMarginLY === null) ? null : actualMarginPct - plannedMarginLY;

      // Weeks of Stock remaining, using cost $ (matches how inventory is valued elsewhere).
      // Weekly rate prefers this month's actual run-rate once we have any actuals (most current
      // signal for "should I reorder now"); falls back to the flat forecast rate early in the
      // month before there's enough actual data to trust.
      const weeklyRate = (actualCost !== null && daysElapsed > 0) ? (actualCost / daysElapsed) * 7 : (forecastCost / totalDays) * 7;
      const currentStockValue = liveInventory ? (liveInventory.totals[type] ? liveInventory.totals[type].value : 0) : null;
      const weeksOfStock = (currentStockValue !== null && weeklyRate > 0) ? currentStockValue / weeklyRate : null;
      const weeksTarget = a.wosTarget;
      const weeksDiff = weeksOfStock === null ? null : weeksOfStock - weeksTarget;

      rows[type] = {
        cat, forecastRetail, forecastCost, expectedRetail, expectedCost,
        actualRetail, actualCost, diffRetail, diffCost,
        plannedMarginGM, plannedMarginLY, actualMarginPct, diffVsGM, diffVsLY,
        weeklyRate, currentStockValue, weeksOfStock, weeksTarget, weeksDiff,
      };
    });

    // Roll up dollars by summing (correct for $), then recompute margin % from the summed
    // dollars rather than averaging percentages (avoids skew from small-dollar rows).
    function rollUp(types) {
      let forecastRetail = 0, forecastCost = 0, expectedRetail = 0, expectedCost = 0;
      let actualRetail = 0, actualCost = 0, anyActuals = false;
      let lySalesSum = 0, lyCogsSum = 0, weightedGM = 0, gmWeight = 0;
      let stockSum = 0, anyStock = false, rateSum = 0, weightedWeeksTarget = 0, weeksTargetWeight = 0;
      types.forEach((t) => {
        const r = rows[t];
        forecastRetail += r.forecastRetail; forecastCost += r.forecastCost;
        expectedRetail += r.expectedRetail; expectedCost += r.expectedCost;
        if (r.actualRetail !== null) { actualRetail += r.actualRetail; actualCost += r.actualCost; anyActuals = true; }
        const row = getRow(t, mStr);
        lySalesSum += num(row.lySales); lyCogsSum += num(row.lyCogs);
        weightedGM += r.plannedMarginGM * r.forecastRetail; gmWeight += r.forecastRetail;
        if (r.currentStockValue !== null) { stockSum += r.currentStockValue; anyStock = true; }
        rateSum += r.weeklyRate;
        weightedWeeksTarget += r.weeksTarget * r.weeklyRate; weeksTargetWeight += r.weeklyRate;
      });
      const plannedMarginGM = gmWeight > 0 ? weightedGM / gmWeight : null;
      const plannedMarginLY = lySalesSum > 0 ? ((lySalesSum - lyCogsSum) / lySalesSum) * 100 : null;
      const actualMarginPct = anyActuals && actualRetail > 0 ? ((actualRetail - actualCost) / actualRetail) * 100 : null;
      const weeksOfStock = (anyStock && rateSum > 0) ? stockSum / rateSum : null;
      const weeksTarget = weeksTargetWeight > 0 ? weightedWeeksTarget / weeksTargetWeight : null;
      return {
        forecastRetail, forecastCost, expectedRetail, expectedCost,
        actualRetail: anyActuals ? actualRetail : null, actualCost: anyActuals ? actualCost : null,
        diffRetail: anyActuals ? actualRetail - expectedRetail : null,
        diffCost: anyActuals ? actualCost - expectedCost : null,
        plannedMarginGM, plannedMarginLY, actualMarginPct,
        diffVsGM: actualMarginPct !== null && plannedMarginGM !== null ? actualMarginPct - plannedMarginGM : null,
        diffVsLY: actualMarginPct !== null && plannedMarginLY !== null ? actualMarginPct - plannedMarginLY : null,
        currentStockValue: anyStock ? stockSum : null, weeksOfStock, weeksTarget,
        weeksDiff: weeksOfStock !== null && weeksTarget !== null ? weeksOfStock - weeksTarget : null,
      };
    }

    const catTotals = {};
    CATEGORIES.forEach((cat) => { catTotals[cat] = rollUp(TYPES_BY_CATEGORY[cat]); });
    const grand = rollUp(TAXONOMY.map(([t]) => t));

    return { mStr, pctElapsed, daysElapsed, totalDays, rows, catTotals, grand, usingWeekdayMatch, dailyPace };
  }, [data, assumptions, months, dailySales, liveInventory]);

  const filteredTaxonomy = filterSelection === "all" ? TAXONOMY
    : filterSelection.startsWith("cat:") ? TAXONOMY.filter(([, cat]) => cat === filterSelection.slice(4))
    : TAXONOMY.filter(([type]) => type === filterSelection.slice(5));

  // Headline totals net WITHIN each planning group before flooring at zero, so a
  // type you're overstocked in (wide leg) offsets one you need to buy (slim leg)
  // when they're really the same decision - a truer, smaller buy number.
  const grandTotalBuy = useMemo(
    () => groupNames.reduce((sum, g) => sum + Math.max(groupOverUnderAt(typesByGroup[g], monthCursor), 0), 0),
    [groupNames, typesByGroup, seriesByType, monthCursor]
  );
  const grandTotalOverstock = useMemo(
    () => groupNames.reduce((sum, g) => sum + Math.min(groupOverUnderAt(typesByGroup[g], monthCursor), 0), 0),
    [groupNames, typesByGroup, seriesByType, monthCursor]
  );

  const expandedSeries = expandedType ? seriesByType[expandedType] : null;
  const chartData = expandedSeries ? expandedSeries.map((s) => ({ month: monthLabel(s.mKey), value: Math.round(s.overUnder) })) : [];

  function parseAndPreview(text) {
    setImportError("");
    Papa.parse(text.trim(), {
      header: true, skipEmptyLines: true,
      complete: (res) => {
        const cols = res.meta.fields || [];
        const isBOMFormat = cols.some((c) => c.toLowerCase().includes("shopify product type")) && cols.some((c) => c.toLowerCase().includes("beginning inv"));
        if (isBOMFormat) {
          setImportFormat("bom");
          setImportPreview(res.data.slice(0, 5000));
          return;
        }
        const isPOFormat = cols.includes("Product Type") && cols.includes("Total Cost Ordered") && cols.includes("Total Cost Received");
        if (isPOFormat) {
          setImportFormat("po");
          setImportPreview(res.data.slice(0, 5000));
          return;
        }
        const isDailySalesFormat = !cols.includes("Product Type") && cols.some((c) => /^(day|date)$/i.test(c.trim())) && cols.some((c) => /sales/i.test(c));
        if (isDailySalesFormat) {
          setImportFormat("dailySales");
          setImportPreview(res.data.slice(0, 5000));
          return;
        }
        const isStockFormat = cols.includes("Type") && cols.some((c) => /variant inventory qty/i.test(c)) && cols.some((c) => /cost per item/i.test(c));
        if (isStockFormat) {
          setImportFormat("stock");
          setImportPreview(res.data.slice(0, 60000));
          return;
        }
        setImportFormat("generic");
        const required = ["Product Type", "Month"];
        const missing = required.filter((r) => !cols.includes(r));
        if (missing.length) { setImportError(`Missing required column(s): ${missing.join(", ")}. (For a PO/receiving export, include "Total Cost Ordered" and "Total Cost Received" columns instead.)`); setImportPreview(null); return; }
        setImportPreview(res.data.slice(0, 2000));
      },
      error: (err) => { setImportError("Could not parse that CSV: " + err.message); setImportPreview(null); },
    });
  }
  const MONTH_NAMES = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseMonthToKey(raw) {
    const s = (raw || "").trim();
    if (/^\d{4}-\d{1,2}$/.test(s)) { const [y, m] = s.split("-"); return `${y}-${m.padStart(2, "0")}`; }
    let m = s.match(/^([A-Za-z]{3,9})[\s\-\/]?'?(\d{2,4})$/); // "Jul-26", "Jul 2026", "July/26"
    if (m) {
      const mon = MONTH_NAMES[m[1].slice(0, 3).toLowerCase()];
      if (mon) { let yr = m[2]; if (yr.length === 2) yr = (Number(yr) < 50 ? "20" : "19") + yr; return `${yr}-${String(mon).padStart(2, "0")}`; }
    }
    m = s.match(/^'?(\d{2,4})[\s\-\/]([A-Za-z]{3,9})$/); // "26-Jul", "2026 Jul"
    if (m) {
      const mon = MONTH_NAMES[m[2].slice(0, 3).toLowerCase()];
      if (mon) { let yr = m[1]; if (yr.length === 2) yr = (Number(yr) < 50 ? "20" : "19") + yr; return `${yr}-${String(mon).padStart(2, "0")}`; }
    }
    m = s.match(/^(\d{1,2})[\/\-](\d{4})$/); // "07/2026" or "07-2026"
    if (m) return `${m[2]}-${m[1].padStart(2, "0")}`;
    return s; // unrecognized - left as-is, row simply won't match a real month column
  }
  function applyImport() {

    if (importFormat === "stock") { applyStockImport(); return; }
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    setData((prev) => {

        const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
        let mKey = parseMonthToKey(mRaw);
        const typeData = { ...(next[match] || {}) };
        const existing = typeData[mKey] || emptyRow();
        const patch = {};
        const map = { "LY Sales": "lySales", "LY COGS": "lyCogs", "Actual Sales": "actualSales", "Actual COGS": "actualCogs", "Received": "received", "Balance to Receive": "balanceToReceive", "Target BOM Override": "targetBOMOverride", "Actual BOM Override": "actualBOMOverride" };
        Object.entries(map).forEach(([col, key]) => { if (r[col] !== undefined && r[col] !== "") patch[key] = Number(r[col]); });
        typeData[mKey] = { ...existing, ...patch };
        next[match] = typeData;
      });
      return next;

  // Aggregates a line-item PO/receiving export (Product Type, Expected Date, Received Date,
  // Total Cost Ordered, Total Cost Received) into Received $ / Balance to Receive $ per
  // product type per month. Re-importing REPLACES those two fields for every product type that
  // appears in the file - each such type is cleared across all 12 months first, then rewritten
  // from the file. That matters because PO dates move: if a PO slips from September to October,
  // a month-by-month overwrite would write the new October balance but leave September's stale
  // balance stranded, and the engine would count those dollars as inbound twice. Types absent
  // from the file are left untouched, so a partial export (one vendor, say) is still safe.
  function applyPOImport() {
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    const monthOf = (dateStr) => { const s = (dateStr || "").trim(); return /^\d{4}-\d{2}/.test(s) ? s.slice(0, 7) : null; };
    const totals = {}; // type -> month -> { received, balance }
    let matchedRows = 0, skippedRows = 0;
    importPreview.forEach((r) => {
      const typeName = (r["Product Type"] || "").trim();
      if (!typeName || !validTypes.has(typeName.toLowerCase())) { skippedRows++; return; }
      const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
      const ordered = Number(r["Total Cost Ordered"]) || 0;
      const received = Number(r["Total Cost Received"]) || 0;
      const balance = Math.max(0, ordered - received);
      const receivedMonth = monthOf(r["Received Date"]);
      const expectedMonth = monthOf(r["Expected Date"]) || receivedMonth || months[monthCursor];
      matchedRows++;
      totals[match] = totals[match] || {};
      if (received > 0 && receivedMonth) {
        totals[match][receivedMonth] = totals[match][receivedMonth] || { received: 0, balance: 0 };
        totals[match][receivedMonth].received += received;
      }
      if (balance > 0.005) {
        totals[match][expectedMonth] = totals[match][expectedMonth] || { received: 0, balance: 0 };
        totals[match][expectedMonth].balance += balance;
      }
    });
    setData((prev) => {
      const next = { ...prev };
      Object.entries(totals).forEach(([type, byMonth]) => {
        const typeData = { ...(next[type] || {}) };
        // Wipe this type's on-order everywhere before rewriting it, so months that dropped out
        // of the export (a moved expected date, a cancelled PO) don't keep their old dollars.
        // Only these two fields are touched - LY sales, actuals and overrides are preserved.
        Object.keys(typeData).forEach((mKey) => {
          typeData[mKey] = { ...typeData[mKey], received: 0, balanceToReceive: 0 };
        });
        Object.entries(byMonth).forEach(([mKey, vals]) => {
          const existing = typeData[mKey] || emptyRow();
          typeData[mKey] = { ...existing, received: Number(vals.received.toFixed(2)), balanceToReceive: Number(vals.balance.toFixed(2)) };
        });
        next[type] = typeData;
      });
      return next;
    });
    setImportSummary(`Applied ${matchedRows} line items across ${Object.keys(totals).length} product types (on-order replaced for those types).`
      + (skippedRows ? ` ⚠ Skipped ${skippedRows} row(s) whose Product Type didn't match the taxonomy - those POs are NOT counted as inbound.` : ""));
    setShowImport(false); setImportText(""); setImportPreview(null);
  }
  // Applies a "Beginning Inv $" / starting BOM template (Planning Category, Shopify Product
  // Type, Plan Month, Beginning Inv $) as each product type's Starting Actual BOM $.
  function applyBOMImport() {
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    const typeCol = Object.keys(importPreview[0] || {}).find((c) => c.toLowerCase().includes("shopify product type"));
    const invCol = Object.keys(importPreview[0] || {}).find((c) => c.toLowerCase().includes("beginning inv"));

  // Parses dates like "Jul 1, 2026", "2026-07-01", "07/01/2026" into an ISO "YYYY-MM-DD" string.
  // Store-wide daily net sales, used to build a real (not flat-assumed) pacing curve for Month
  // Pace's Expected-to-date - see computeDailyPaceRatio. Merges into dailySales rather than
  // replacing it, so LY and multiple months can be imported separately over time.
  function parseDailyDateToISO(raw) {
    const s = (raw || "").trim();
    if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
      const [y, m, d] = s.split("-");
      return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
    }
    const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // "07/01/2026"
    if (m1) return `${m1[3]}-${m1[1].padStart(2, "0")}-${m1[2].padStart(2, "0")}`;
    const d = new Date(s); // handles "Jul 1, 2026", "July 1 2026", etc.
    if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    return null;
  }
  function applyDailySalesImport() {
    const cols = Object.keys(importPreview[0] || {});
    const dateCol = cols.find((c) => /^(day|date)$/i.test(c.trim()));
    const salesCol = cols.find((c) => /sales/i.test(c));
    if (!dateCol || !salesCol) { setImportError("Could not find a Day/Date column and a Sales column in this file."); return; }
    let matched = 0, skipped = 0;
    const updates = {};
    importPreview.forEach((r) => {
      const iso = parseDailyDateToISO(r[dateCol]);
      const amt = Number(String(r[salesCol] ?? "").replace(/[^0-9.\-]/g, ""));
      if (!iso || isNaN(amt)) { skipped++; return; }
      updates[iso] = amt;
      matched++;
    });
    setDailySales((prev) => ({ ...prev, ...updates }));
    setImportSummary(`Imported daily sales for ${matched} day(s)${skipped ? `, skipped ${skipped} row(s) that didn't parse` : ""}.`);
    setShowImport(false); setImportText(""); setImportPreview(null);
  }
  // Aggregates Shopify's native product export (one row per variant) into inventory value per
  // Product Type, feeding straight into the same liveInventory shape the live "Check current
  // stock" pull uses - Weeks of Stock doesn't care which source it came from. Handles Shopify's
  // export quirk where "Type" is sometimes only populated on a product's first variant row, by
  // forward-filling it per Handle.
  function applyStockImport() {
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    const cols = Object.keys(importPreview[0] || {});
    const typeCol = "Type";
    const qtyCol = cols.find((c) => /variant inventory qty/i.test(c));
    const costCol = cols.find((c) => /cost per item/i.test(c));
    const handleCol = cols.find((c) => /^handle$/i.test(c));
    if (!qtyCol || !costCol) { setImportError("Could not find Variant Inventory Qty and Cost per item columns in this file."); return; }
    const totals = {};
    let lastType = "";
    let matched = 0, skipped = 0, variantCount = 0;
    importPreview.forEach((r) => {
      const handleVal = handleCol ? r[handleCol] : null;
      let typeName = (r[typeCol] || "").trim();
      if (!typeName && lastType) typeName = lastType; // forward-fill from the product's first row
      if (typeName) lastType = typeName;
      const qty = Number(r[qtyCol]);
      if (isNaN(qty)) { skipped++; return; } // blank qty = a non-variant summary row in some exports; skip quietly
      variantCount++;
      if (!typeName || !validTypes.has(typeName.toLowerCase())) { skipped++; return; }
      const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
      const cost = Number(String(r[costCol] ?? "").replace(/[^0-9.\-]/g, "")) || 0;
      if (!totals[match]) totals[match] = { units: 0, value: 0 };
      totals[match].units += qty;
      totals[match].value += qty * cost;
      matched++;
    });
    setLiveInventory({ totals, loadedAt: new Date(), truncated: false, variantsScanned: variantCount, source: "import" });
    setImportSummary(`Imported current stock from ${variantCount} variant row(s), matched ${matched} to a Product Type${skipped ? `, skipped ${skipped}` : ""}.`);
    setShowImport(false); setImportText(""); setImportPreview(null);
  }

  async function testConnection() {
    setSyncStatus("Testing connection…");

      const res = await fetch(`/health`).then((r) => r.json());

  // Weekday-matched LY comparison for Month Pace's Expected-to-date. Rather than assuming sales
  // land evenly across the month (flat % of days elapsed), this compares against LY's actual daily
  // sales for the same weekday-aligned window - e.g. "Jul 1-18, 2026" compares against "Jul 2-19,
  // 2025" if that's the range with matching weekdays - same approach Shopify's own reports use,
  // since a store's daily rhythm tracks day-of-week far more than raw calendar date.
  // NOTE: Shopify's live Admin API only returns order history for the last ~60 days for custom
  // apps like this one, so a year-old window can't be pulled live - this is why dailySales is
  // imported via CSV (see the "Daily Sales" import format) instead of fetched from /sales-by-type.
  function ymdLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function weekdayMatchedLYWindow(mStr, daysElapsed) {
    const [y, m] = mStr.split("-").map(Number);
    const thisMonthStart = new Date(y, m - 1, 1);
    const lyMonthStart = new Date(y - 1, m - 1, 1);
    const lyMonthEnd = new Date(y - 1, m, 0);
    const shift = (thisMonthStart.getDay() - lyMonthStart.getDay() + 7) % 7;
    const lyWindowStart = new Date(lyMonthStart); lyWindowStart.setDate(lyMonthStart.getDate() + shift);
    const lyWindowEnd = new Date(lyWindowStart); lyWindowEnd.setDate(lyWindowStart.getDate() + daysElapsed - 1);
    return { lyMonthStart, lyMonthEnd, lyWindowStart, lyWindowEnd };
  }
  // Returns { ratio, complete, ... } - ratio = fraction of LY's full month that landed in the
  // weekday-matched window so far. complete = true only if every day in both ranges has imported
  // data, so a partial import doesn't silently produce a misleading ratio.
  function computeDailyPaceRatio(mStr, daysElapsed) {
    const { lyMonthStart, lyMonthEnd, lyWindowStart, lyWindowEnd } = weekdayMatchedLYWindow(mStr, daysElapsed);
    let windowSum = 0, windowDaysFound = 0, windowDaysTotal = 0;
    for (let d = new Date(lyWindowStart); d <= lyWindowEnd; d.setDate(d.getDate() + 1)) {
      windowDaysTotal++;
      const key = ymdLocal(d);
      if (dailySales[key] !== undefined) { windowSum += dailySales[key]; windowDaysFound++; }
    }
    let monthSum = 0, monthDaysFound = 0, monthDaysTotal = 0;
    for (let d = new Date(lyMonthStart); d <= lyMonthEnd; d.setDate(d.getDate() + 1)) {
      monthDaysTotal++;
      const key = ymdLocal(d);
      if (dailySales[key] !== undefined) { monthSum += dailySales[key]; monthDaysFound++; }
    }
    const complete = windowDaysFound === windowDaysTotal && monthDaysFound === monthDaysTotal && monthSum > 0;
    return {
      ratio: complete ? windowSum / monthSum : null, complete,
      windowStart: ymdLocal(lyWindowStart), windowEnd: ymdLocal(lyWindowEnd),
      monthStart: ymdLocal(lyMonthStart), monthEnd: ymdLocal(lyMonthEnd),
      windowDaysFound, windowDaysTotal, monthDaysFound, monthDaysTotal,
    };
  }

  async function syncSales() {
    setSyncing(true);
    setSyncStatus(`Syncing sales & COGS for ${monthLabel(months[monthCursor])}…`);
    try {
      const mStr = months[monthCursor];
      const [y, m] = mStr.split("-").map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      const start = `${mStr}-01`;
      const end = `${mStr}-${String(lastDay).padStart(2, "0")}`;
      const lyStart = `${y - 1}-${String(m).padStart(2, "0")}-01`;
      const lyEnd = `${y - 1}-${String(m).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
      const [cur, ly] = await Promise.all([
        fetch(`/sales-by-type?start=${start}&end=${end}`).then((r) => r.json()),
        fetch(`/sales-by-type?start=${lyStart}&end=${lyEnd}`).then((r) => r.json()),
      ]);
      if (cur.error) throw new Error(cur.error);
      if (ly.error) throw new Error(ly.error);
      let matched = 0;
      // Only current-period totals get force-set to 0 when a type has no matching orders this
      // pull - this is what clears stale dollars when an order's product gets reclassified into
      // a different Product Type after the fact. LY totals are left as "patch only if present":
      // Shopify's live order-history API can't reliably reach a year back, so an empty LY result
      // usually just means that pull was blocked, not that LY genuinely had zero sales - blindly
      // zeroing it would wipe out real historical data.
      const curHasAnyData = cur.totals && Object.keys(cur.totals).length > 0;
      TAXONOMY.forEach(([type]) => {
        const c = cur.totals?.[type];
        const l = ly.totals?.[type];
        const patch = {};
        if (curHasAnyData) {
          patch.actualSales = Number((c ? c.sales : 0).toFixed(2));
          patch.actualCogs = Number((c ? c.cogs : 0).toFixed(2));
        }
        if (l) { patch.lySales = Number(l.sales.toFixed(2)); patch.lyCogs = Number(l.cogs.toFixed(2)); }
        if (Object.keys(patch).length === 0) return;
        matched++;
        setRow(type, mStr, patch);
      });
      const lyEmpty = !ly.totals || Object.keys(ly.totals).length === 0;
      setSyncStatus(`Synced ${matched} of ${TAXONOMY.length} product types for ${monthLabel(mStr)}.`
        + (!curHasAnyData ? " ⚠ No current-period sales came back at all - if this month should have sales, the pull may have failed rather than the month genuinely being empty." : "")
        + (lyEmpty ? " (No LY data returned - normal if this month is more than ~60 days in the past; Shopify's live API can't reach back that far for LY.)" : ""));
    } catch (e) { setSyncStatus("Sync failed: " + e.message); }
    setSyncing(false);
  }

  // Suggests a Growth % per category based on the last 3 completed calendar months'
  // actual sales vs. the same 3 months a year earlier - a data-driven starting point
  // instead of guessing, using sales data already flowing through the live sync.
  async function calculateGrowthSuggestions() {
    setCalculatingSuggestions(true);
    setSuggestionsStatus("Calculating from trailing 3 months of actual sales…");
    try {
      const now = new Date();
      now.setDate(1);
      const trailingMonths = [];
      for (let i = 3; i >= 1; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        trailingMonths.push(d);
      }
      async function sumSalesForMonths(dates) {
        const results = await Promise.all(dates.map((d) => {
          const y = d.getFullYear(), m = d.getMonth() + 1;
          const lastDay = new Date(y, m, 0).getDate();
          const start = `${y}-${String(m).padStart(2, "0")}-01`;
          const end = `${y}-${String(m).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
          return fetch(`/sales-by-type?start=${start}&end=${end}`).then((r) => r.json());
        }));
        const byType = {};
        results.forEach((res) => {
          if (res.error) throw new Error(res.error);
          Object.entries(res.totals || {}).forEach(([type, t]) => {
            byType[type] = (byType[type] || 0) + t.sales;
          });
        });
        return byType;
      }
      const lyMonths = trailingMonths.map((d) => new Date(d.getFullYear() - 1, d.getMonth(), 1));
      const [thisYear, lastYear] = await Promise.all([sumSalesForMonths(trailingMonths), sumSalesForMonths(lyMonths)]);

      const catThis = {}, catLast = {};
      TAXONOMY.forEach(([type, cat]) => {
        catThis[cat] = (catThis[cat] || 0) + (thisYear[type] || 0);
        catLast[cat] = (catLast[cat] || 0) + (lastYear[type] || 0);
      });
      const suggestions = {};
      CATEGORIES.forEach((cat) => {
        if (catLast[cat] > 0) suggestions[cat] = Math.round(((catThis[cat] / catLast[cat]) - 1) * 1000) / 10;
      });
      setGrowthSuggestions(suggestions);
      setSuggestionsStatus(`Done - based on ${monthLabel(`${trailingMonths[0].getFullYear()}-${String(trailingMonths[0].getMonth()+1).padStart(2,"0")}`)} through ${monthLabel(`${trailingMonths[2].getFullYear()}-${String(trailingMonths[2].getMonth()+1).padStart(2,"0")}`)} vs the same months last year.`);
    } catch (e) {
      setSuggestionsStatus("Could not calculate: " + e.message);
    }
    setCalculatingSuggestions(false);
  }

  function clearStrayBOMOverrides() {
    let cleared = 0;
    setData((prev) => {
      const next = { ...prev };
      TAXONOMY.forEach(([type]) => {
        const typeData = { ...(next[type] || {}) };
        months.slice(1).forEach((mKey) => {
          const row = typeData[mKey];
          if (row && row.actualBOMOverride !== "" && row.actualBOMOverride !== undefined) {
            cleared++;
            typeData[mKey] = { ...row, actualBOMOverride: "" };
          }
        });
        next[type] = typeData;
      });
