        )}
        <div className="mt-4 flex items-start gap-2 text-xs" style={{ color: "#8B8F98" }}>
          <Icon.info />
          <span>
            Target EOM $ = BOM $ + Expected receipts − Forecast COGS. BOM $ auto-rolls from actual COGS/receipts while actual sales are entered; once a month has no actual sales yet, it automatically switches to rolling forward from the prior month's Target EOM. WOS Target EOM $ = sum of forecasted COGS across the next N weeks (your WOS target) starting the month AFTER this one, prorated for partial months — it is measured against month-end stock, by which point this month's own sales have already gone, so the window has to look forward from there. The window wraps around the year rather than stopping at the edge of the grid, so the last months are no longer understated; the portion that wraps is estimated off a basis a year further back. Over/Under $ = WOS Target EOM − Target EOM. Positive = Buy. Click any row to open its full monthly ledger and edit inputs.
          </span>
        </div>
      </div>
      )}

      {showSync && (
        <Modal onClose={() => setShowSync(false)} title="Live sync from Shopify">
          <p className="text-sm mb-3" style={{ color: "#5C6270" }}>
            This page is served directly by your Shopify proxy, so sync talks to it automatically - no URL to paste. Pulls Actual Sales, Actual COGS, and LY Sales/COGS. Received $, Balance to Receive $, and Starting Actual BOM $ still need to be entered by hand - see Import above.
          </p>
          <div className="flex gap-2 mb-3">
            <button onClick={testConnection} className="text-xs px-3 py-1.5 rounded" style={{ background: "#E6E1D6" }}>Test connection</button>
          </div>
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>Sales & COGS sync into: <b>{monthLabel(months[monthCursor])}</b> (change with the dashboard arrows).</div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={syncSales} disabled={syncing} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
                <Icon.refresh /> Sync Sales & COGS
              </button>
            </div>
          </div>
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>
              Starting Actual BOM $ (what's physically on the shelf right now) is set via Import → "Starting BOM template" - Planning Category, Shopify Product Type, Plan Month, Beginning Inv $. There used to be a live "Sync Inventory" button here, but it was removed: Shopify's inventory API sums stock across ALL locations, including a store's fake/PO-only location if it has one, which silently corrupted this number for multi-location setups. The CSV import lets you filter to your real location first.
            </div>
          </div>
          <div className="p-3 rounded mb-3" style={{ background: "#FBF6EA" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>Legacy cleanup: if the old live Inventory sync was ever run while viewing a future month, it may have left stray $0 (or other) overrides sitting in "Actual BOM $ (override)" for months after that point. This clears those out (leaves the current month's Starting BOM untouched) so those months roll forward normally again.</div>
            <button onClick={clearStrayBOMOverrides} className="text-xs px-3 py-2 rounded flex items-center gap-1.5" style={{ background: "#B5432D", color: "#FBF6EA" }}>
              Clear stray BOM overrides ({monthLabel(months[Math.min(monthCursor + 1, 11)])} onward)
            </button>
          </div>
          {syncStatus && <div className="text-xs" style={{ color: syncStatus.startsWith("Sync failed") || syncStatus.startsWith("Could not") ? "#B5432D" : "#5B7A5B" }}>{syncStatus}</div>}
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowSync(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showVendors && (
        <Modal onClose={() => setShowVendors(false)} title="Vendor performance">
          <p className="text-sm mb-3" style={{ color: "#5C6270" }}>
            Actual margin comes from real synced sales & COGS. Planned margin is a sales-weighted average of the GM% assumptions for whatever categories that vendor's products fall into. Going back more than ~60 days may come back empty until your Shopify app has extended order history access.
          </p>
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <div className="flex items-center gap-2">
              <button onClick={() => setVendorMonthOffset((o) => o - 1)} className="p-1 rounded" style={{ background: "#F1EEE6" }}><Icon.chevronLeft /></button>
              <span className="text-xs" style={{ color: "#5C6270" }}>
                Ending: <b>{(() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + vendorMonthOffset); return monthLabel(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); })()}</b>
              </span>
              <button onClick={() => setVendorMonthOffset((o) => o + 1)} className="p-1 rounded" style={{ background: "#F1EEE6" }}><Icon.chevronRight /></button>
            </div>
            <label className="text-xs flex items-center gap-1.5">
              Show last
              <input type="number" min="1" max="12" value={vendorRangeSize} onChange={(e) => setVendorRangeSize(Math.max(1, Math.min(12, Number(e.target.value))))} className="w-12 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} />
              months
            </label>
            <label className="text-xs flex items-center gap-1.5">
              Metric
              <select value={vendorMetric} onChange={(e) => setVendorMetric(e.target.value)} className="border rounded px-2 py-1 text-xs" style={{ borderColor: "#DCD5C4" }}>
                <option value="sales">Sales $</option>
                <option value="cogs">COGS $</option>
                <option value="actualMarginPct">Actual Margin %</option>
                <option value="plannedMarginPct">Planned Margin %</option>
                <option value="marginDiff">Diff vs Planned</option>
              </select>
            </label>
            <button onClick={loadVendorReport} disabled={loadingVendors} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.refresh /> {loadingVendors ? "Loading…" : "Load"}
            </button>
          </div>
          {vendorStatus && <div className="text-xs mb-3" style={{ color: vendorStatus.startsWith("Failed") ? "#B5432D" : "#5B7A5B" }}>{vendorStatus}</div>}
          {vendorTable && vendorMonths.length > 0 && (
            <div className="overflow-auto border rounded" style={{ borderColor: "#DCD5C4", maxHeight: "60vh" }}>
              <table style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace", width: "max-content", minWidth: "100%" }} className="text-xs">
                <thead>
                  <tr>
                    <th style={{ position: "sticky", top: 0, left: 0, zIndex: 3, background: "#20232B", color: "#EDE7DA", minWidth: 160 }} className="text-left py-2 px-2 cursor-pointer" onClick={() => setVendorSort("vendor")}>Vendor</th>
                    {vendorMonths.map((mStr) => (
                      <th key={mStr} style={{ position: "sticky", top: 0, zIndex: 2, background: "#2A303B", color: "#EDE7DA", minWidth: 95 }} className="text-right py-2 px-2">{monthLabel(mStr)}</th>
                    ))}
                    <th style={{ position: "sticky", top: 0, zIndex: 2, background: "#2A303B", color: "#EDE7DA", minWidth: 95 }} className="text-right py-2 px-2 cursor-pointer" onClick={() => setVendorSort("total")}>Total Sales</th>
                  </tr>
                </thead>
                <tbody>
                  {Object.entries(vendorTable)
                    .map(([vendor, byMonth]) => {
                      const totalSales = Object.values(byMonth).reduce((s, m) => s + (m.sales || 0), 0);
                      return { vendor, byMonth, totalSales };
                    })
                    .sort((a, b) => {
                      if (vendorSort === "vendor") return a.vendor.localeCompare(b.vendor);
                      if (vendorSort === "total") return b.totalSales - a.totalSales;
                      const aLast = Object.values(a.byMonth).slice(-1)[0]?.[vendorSort] ?? -Infinity;
                      const bLast = Object.values(b.byMonth).slice(-1)[0]?.[vendorSort] ?? -Infinity;
                      return bLast - aLast;
                    })
                    .map(({ vendor, byMonth, totalSales }) => (
                      <tr key={vendor} style={{ borderTop: "1px solid #EDE9DE" }}>
                        <td style={{ position: "sticky", left: 0, zIndex: 1, background: "#FFFFFF" }} className="py-1.5 px-2" >{vendor}</td>
                        {vendorMonths.map((mStr) => {
                          const cell = byMonth[mStr];
                          const v = cell ? cell[vendorMetric] : null;
                          const isPct = vendorMetric.toLowerCase().includes("pct") || vendorMetric === "marginDiff";
                          const display = v === null || v === undefined ? "—" : isPct ? `${v >= 0 ? "" : ""}${v.toFixed(1)}%` : money(v);
                          const color = v === null || v === undefined ? "#B0B4BC" : vendorMetric === "marginDiff" ? (v >= 0 ? "#5B7A5B" : "#B5432D") : "#20232B";
                          return <td key={mStr} className="text-right py-1.5 px-2" style={{ color }}>{display}</td>;
                        })}
                        <td className="text-right py-1.5 px-2" style={{ fontWeight: 600 }}>{money(totalSales)}</td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          )}
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowVendors(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showSettings && (
        <Modal onClose={() => setShowSettings(false)} title="Category assumptions">
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>Suggests a Growth % per category from your actual trailing 3 months of sales vs. the same 3 months last year - a data-driven starting point instead of a guess.</div>
            <button onClick={calculateGrowthSuggestions} disabled={calculatingSuggestions} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.refresh /> {calculatingSuggestions ? "Calculating…" : "Calculate suggested growth %"}
            </button>
            {suggestionsStatus && <div className="text-xs mt-2" style={{ color: suggestionsStatus.startsWith("Could not") ? "#B5432D" : "#5B7A5B" }}>{suggestionsStatus}</div>}
          </div>
          <div className="space-y-2 max-h-96 overflow-y-auto">
            {CATEGORIES.map((c) => {
              const a = getAssumptions(c);
              const suggestion = growthSuggestions[c];
              return (
                <div key={c} className="flex items-center gap-2 p-2 rounded border text-xs flex-wrap" style={{ borderColor: "#DCD5C4" }}>
                  <span style={{ width: 9, height: 9, borderRadius: 2, background: CATEGORY_COLOR[c], flexShrink: 0 }} />
                  <span className="flex-1 min-w-[140px]" style={{ fontWeight: 500 }}>{c}</span>
                  <label className="flex items-center gap-1">Growth % <input type="number" value={a.growthPct} onChange={(e) => setAssumption(c, { growthPct: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                  {suggestion !== undefined && (
                    <button onClick={() => setAssumption(c, { growthPct: suggestion })} className="px-2 py-1 rounded text-[10px]" style={{ background: "#FBF6EA", color: "#8C6E4A", fontWeight: 600 }} title="Click to apply this suggestion">
                      Suggested: {suggestion > 0 ? "+" : ""}{suggestion}%
                    </button>
                  )}
                  <label className="flex items-center gap-1">WOS <input type="number" value={a.wosTarget} onChange={(e) => setAssumption(c, { wosTarget: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                  <label className="flex items-center gap-1">GM % <input type="number" value={a.gmPct} onChange={(e) => setAssumption(c, { gmPct: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                </div>
              );
            })}
          </div>
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowSettings(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showGroups && (
        <Modal onClose={() => setShowGroups(false)} title="Planning groups">
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>
              Pool the product types your customer treats as interchangeable - solid vs printed, or the silhouettes a season rotates through (slim vs wide leg). Buys and overstock net <b>within</b> a group before anything is called a buy, so a type you're overstocked in offsets one you need. Your Shopify product types are never changed - this is a planning layer only. Type a new name to create a group; clear a box to plan that type on its own.
            </div>
            <button onClick={() => setPlanGroups(defaultPlanGroups())} className="text-xs px-3 py-2 rounded flex items-center gap-1.5" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.refresh /> Reset to suggested groups
            </button>
          </div>
          <datalist id="planGroupNames">{groupNames.map((g) => <option key={g} value={g} />)}</datalist>
          <div className="space-y-1.5 max-h-96 overflow-y-auto">
            {TAXONOMY.map(([type, cat]) => (
              <div key={type} className="flex items-center gap-2 p-2 rounded border text-xs" style={{ borderColor: "#DCD5C4" }}>
                <span style={{ width: 9, height: 9, borderRadius: 2, background: CATEGORY_COLOR[cat], flexShrink: 0 }} />
                <span className="flex-1 min-w-0">
                  <span style={{ fontWeight: 500 }}>{type}</span>
                  <span style={{ color: "#8B8F98" }} className="block text-[10px]">{cat}</span>
                </span>
                <input list="planGroupNames" value={planGroups[type] || ""} onChange={(e) => setPlanGroups((prev) => ({ ...prev, [type]: e.target.value }))} placeholder="(on its own)" className="w-40 border rounded px-2 py-1" style={{ borderColor: "#DCD5C4" }} />
              </div>
            ))}
          </div>
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowGroups(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showImport && (
        <Modal onClose={() => { setShowImport(false); setImportPreview(null); setImportError(""); }} title="Import from CSV">
          <p className="text-sm mb-2" style={{ color: "#5C6270" }}>Formats are auto-detected from the column headers:</p>
          <div className="text-xs mb-2 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Actuals/plan:</b> Product Type, Month, LY Sales, LY COGS, Actual Sales, Actual COGS, Received, Balance to Receive
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>PO/receiving export</b> (e.g. from your "PO Export" Sidekick app): Product Type, Expected Date, Received Date, Total Cost Ordered, Total Cost Received — this one auto-fills Received $ and Balance to Receive $ by month.
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Starting BOM template:</b> Planning Category, Shopify Product Type, Plan Month, Beginning Inv $ — sets each product type's Starting Actual BOM $.
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Daily sales (by date):</b> a Day/Date column plus a Net Sales column, store-wide (not per Product Type) — e.g. Shopify's own "Sales over time" report exported to CSV. Powers Month Pace's weekday-matched Expected-to-date, since Shopify's live API can't reach back a year on its own. Import LY's full month at minimum; safe to re-import/add more dates any time, existing dates just get overwritten.
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Current stock:</b> Shopify's own product export (Products → Export → CSV) — uses its Type, Variant Inventory Qty, and Cost per item columns. Powers Month Pace's Weeks of Stock column. Note: if your store tracks inventory at more than one location, Shopify leaves Variant Inventory Qty out of this export - you'll need to merge in a separate Inventory export (Products → Inventory → Export, filtered to your real location) yourself first. Re-importing replaces the whole stock snapshot.
          </div>
          {importSummary && <div className="text-xs mb-3 p-2 rounded" style={{ background: "#EDF3EA", color: "#5B7A5B" }}>{importSummary}</div>}
          <div className="flex gap-2 mb-3">
            <button onClick={() => fileInputRef.current?.click()} className="text-xs px-3 py-1.5 rounded flex items-center gap-1" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.upload /> Upload CSV file
            </button>
            <input ref={fileInputRef} type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
          </div>
          <textarea value={importText} onChange={(e) => { setImportText(e.target.value); parseAndPreview(e.target.value); }} placeholder="Paste CSV here, or upload a file above" className="w-full h-24 text-xs p-2 rounded border font-mono" style={{ borderColor: "#DCD5C4" }} />
          {importError && <div className="text-xs mt-2" style={{ color: "#B5432D" }}>{importError}</div>}
          {importPreview && (
            <div className="mt-3 text-xs max-h-40 overflow-y-auto border rounded p-2" style={{ borderColor: "#DCD5C4" }}>
              <div className="mb-1" style={{ color: "#8C6E4A", fontWeight: 600 }}>Detected format: {importFormat === "po" ? "PO/receiving export" : importFormat === "bom" ? "Starting BOM template" : importFormat === "dailySales" ? "Daily sales (by date)" : importFormat === "stock" ? "Current stock (Shopify product export)" : "Actuals/plan"} ({importPreview.length} rows)</div>
              {importPreview.slice(0, 8).map((r, i) => (
                <div key={i} style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                  {importFormat === "po"
                    ? `${r["Product Type"]} · ordered ${r["Total Cost Ordered"]} · received ${r["Total Cost Received"]}`
                    : importFormat === "bom"
                    ? `${r[Object.keys(r).find((c) => c.toLowerCase().includes("shopify product type"))]} · ${r[Object.keys(r).find((c) => c.toLowerCase().includes("beginning inv"))]}`
                    : importFormat === "dailySales"
                    ? `${r[Object.keys(r).find((c) => /^(day|date)$/i.test(c.trim()))]} · ${r[Object.keys(r).find((c) => /sales/i.test(c))]}`
                    : importFormat === "stock"
                    ? `${r["Type"] || "(blank - forward-filled)"} · qty ${r[Object.keys(r).find((c) => /variant inventory qty/i.test(c))]} · cost ${r[Object.keys(r).find((c) => /cost per item/i.test(c))]}`
                    : `${r["Product Type"]} · ${r["Month"]} · LY Sales ${r["LY Sales"] ?? "—"} · LY COGS ${r["LY COGS"] ?? "—"}`}
                </div>
              ))}
              {importPreview.length > 8 && <div style={{ color: "#8B8F98" }}>…and {importPreview.length - 8} more rows</div>}
            </div>
          )}
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowImport(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#E6E1D6" }}>Cancel</button>
            <button onClick={applyImport} disabled={!importPreview} className="text-xs px-3 py-2 rounded flex items-center gap-1 disabled:opacity-40" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>
              <Icon.check /> Apply import
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function TypeDetail({ type, months, series, scrollStart, setScrollStart, visibleMonths, getRow, setRow, startingBOM, setStartingBOM, chartData }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <div style={{ fontFamily: "'Roboto Slab', serif" }} className="text-sm font-bold">{type}</div>
        <label className="text-xs flex items-center gap-1.5">
          Starting Actual BOM $
          <input type="number" value={startingBOM ?? 0} onChange={(e) => setStartingBOM(Number(e.target.value))} className="w-24 border rounded px-1.5 py-1" style={{ borderColor: "#DCD5C4" }} />
        </label>
      </div>
      <div className="mb-3"><MiniBarChart data={chartData} /></div>
      <div className="flex items-center justify-between mb-1">
        <button onClick={() => setScrollStart((s) => Math.max(0, s - 1))} disabled={scrollStart === 0} className="p-1 rounded disabled:opacity-30" style={{ background: "#F1EEE6" }}><Icon.chevronLeft /></button>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-xs text-[#8B8F98]">{monthLabel(months[scrollStart])} – {monthLabel(months[Math.min(scrollStart + visibleMonths - 1, 11)])}</span>
        <button onClick={() => setScrollStart((s) => Math.min(months.length - visibleMonths, s + 1))} disabled={scrollStart >= months.length - visibleMonths} className="p-1 rounded disabled:opacity-30" style={{ background: "#F1EEE6" }}><Icon.chevronRight /></button>
      </div>
      <div className="overflow-x-auto">
        <table style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }} className="w-full text-xs">
          <thead>
            <tr>
              <th className="text-left py-1.5 pr-3" style={{ color: "#8B8F98", minWidth: 150 }}>Line</th>
              {months.slice(scrollStart, scrollStart + visibleMonths).map((m) => (<th key={m} className="text-right py-1.5 px-2" style={{ minWidth: 95 }}>{monthLabel(m)}</th>))}
            </tr>
          </thead>
          <tbody>
            {INPUT_FIELDS.map((f) => (
              <tr key={f.key}>
                <td className="py-1 pr-3" style={{ color: f.muted ? "#B0B4BC" : "#5C6270" }}>{f.label}</td>
                {months.slice(scrollStart, scrollStart + visibleMonths).map((m) => {
                  const row = getRow(type, m);
                  return (
                    <td key={m} className="py-1 px-1">
                      <input type="number" value={row[f.key]} placeholder={f.muted ? "—" : "0"} onChange={(e) => setRow(type, m, { [f.key]: e.target.value === "" ? "" : Number(e.target.value) })} className="w-full text-right px-1 py-1 rounded border text-xs" style={{ borderColor: "#E6E1D6", color: f.muted ? "#8B8F98" : "#20232B" }} onClick={(e) => e.stopPropagation()} />
                    </td>
                  );
                })}
              </tr>
            ))}
            <ReadRow label="Forecast Sales $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.forecastSales} />
            <ReadRow label="Forecast COGS $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.forecastCOGS} />
            <ReadRow label="BOM $ used" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.basis} sub={(s) => s.basisSource} />
            <ReadRow label="Expected $ (recv+open PO)" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.expected} />
            <ReadRow label="Target EOM $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.targetEOM} bold />
            <ReadRow label="WOS Target EOM $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.wosTargetEOM} />
            <ReadRow label="Over/Under $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.overUnder} highlight signed />
          </tbody>
        </table>
      </div>
    </div>
  );
}

function diffColor(v) { return v === null || v === undefined ? "#B0B4BC" : v >= 0 ? "#5B7A5B" : "#B5432D"; }
function pctStr(v) { return v === null || v === undefined ? "—" : `${v.toFixed(1)}%`; }

function PaceSummaryCard({ label, value, color }) {
  return (
    <div className="p-3 rounded" style={{ background: "#FFFFFF", border: "1px solid #DCD5C4" }}>
      <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color: "#9AA0AC", fontFamily: "'IBM Plex Mono', monospace" }}>{label}</div>
      <div className="text-base font-bold" style={{ color: color || "#20232B", fontFamily: "'Roboto Slab', serif" }}>{value}</div>
    </div>
  );
}

// Renders the 13 metric cells (Retail x4, Cost x4, Margin x5) for one Month Pace row.
function PaceCells({ row, bold }) {
  const fw = bold ? 700 : 400;
  return (
    <Fragment>
      <td className="text-right py-1.5 px-2 border-l" style={{ fontWeight: fw }}>{money(row.forecastRetail)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{money(row.expectedRetail)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{row.actualRetail === null ? "—" : money(row.actualRetail)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw, color: diffColor(row.diffRetail) }}>{row.diffRetail === null ? "—" : money(row.diffRetail)}</td>
      <td className="text-right py-1.5 px-2 border-l" style={{ fontWeight: fw }}>{money(row.forecastCost)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{money(row.expectedCost)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{row.actualCost === null ? "—" : money(row.actualCost)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw, color: diffColor(row.diffCost) }}>{row.diffCost === null ? "—" : money(row.diffCost)}</td>
      <td className="text-right py-1.5 px-2 border-l" style={{ fontWeight: fw }}>{pctStr(row.plannedMarginGM)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{pctStr(row.plannedMarginLY)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw }}>{pctStr(row.actualMarginPct)}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw, color: diffColor(row.diffVsGM) }}>{row.diffVsGM === null ? "—" : `${row.diffVsGM >= 0 ? "+" : ""}${row.diffVsGM.toFixed(1)}pt`}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw, color: diffColor(row.diffVsLY) }}>{row.diffVsLY === null ? "—" : `${row.diffVsLY >= 0 ? "+" : ""}${row.diffVsLY.toFixed(1)}pt`}</td>
      <td className="text-right py-1.5 px-2 border-l" style={{ fontWeight: fw }}>{row.weeksOfStock === null ? "—" : `${row.weeksOfStock.toFixed(1)} wks`}</td>
      <td className="text-right py-1.5 px-2" style={{ fontWeight: fw, color: diffColor(row.weeksDiff) }}>{row.weeksDiff === null ? "—" : `${row.weeksDiff >= 0 ? "+" : ""}${row.weeksDiff.toFixed(1)} wks`}</td>
    </Fragment>
  );
}

function ReadRow({ label, series, scrollStart, visibleMonths, get, sub, bold, highlight, signed }) {
  return (
    <tr style={highlight ? { background: "#FBF6EA" } : {}}>
      <td className="py-1 pr-3" style={{ color: "#20232B", fontWeight: bold || highlight ? 700 : 500 }}>{label}</td>
      {series.slice(scrollStart, scrollStart + visibleMonths).map((s, i) => {
        const v = get(s);
        const color = signed ? (v > 0 ? "#5B7A5B" : v < 0 ? "#B5432D" : "#20232B") : (v < 0 ? "#B5432D" : "#20232B");
        return (
          <td key={i} className="py-1 px-2 text-right" style={{ fontWeight: bold || highlight ? 700 : 400, color }}>
            {money(v)}
            {sub && <div style={{ fontSize: 9, color: "#B0B4BC", fontWeight: 400 }}>{sub(s)}</div>}
          </td>
        );
      })}
    </tr>
  );
}

function Modal({ children, onClose, title }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(27,32,39,0.6)" }}>
      <div className="w-full max-w-lg rounded-md p-5 max-h-[90vh] overflow-y-auto" style={{ background: "#FFFFFF" }}>
        <div className="flex items-center justify-between mb-3">
          <div style={{ fontFamily: "'Roboto Slab', serif" }} className="font-bold text-lg">{title}</div>
          <button onClick={onClose}><Icon.x /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<OTBEngine />);
</script>
</body>
</html>
