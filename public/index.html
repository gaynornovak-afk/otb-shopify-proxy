const METRICS = [

  { key: "targetEOM", label: "Target EOM $" },

function metricValue(s, key) {
  if (key === "actualSales") return s.row.actualSales === "" || s.row.actualSales === undefined ? null : Number(s.row.actualSales);
  if (key === "buyAction") return s.buyAction;
  return s[key];
}

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function monthLabel(key) { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "2-digit" }); }
function next12Months() { const out = []; const now = new Date(); now.setDate(1); for (let i = 0; i < 12; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); out.push(monthKey(d)); } return out; }
function money(n) { if (n === null || n === undefined) return "—"; const v = Number(n) || 0; return v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }); }
function num(v) { return v === "" || v === undefined || v === null ? 0 : Number(v); }
function emptyRow() {
  return { lySales: 0, lyCogs: 0, actualSales: "", actualCogs: "", received: 0, balanceToReceive: 0, targetBOMOverride: "", actualBOMOverride: "" };
}
function defaultAssumptions() { return { growthPct: 3, wosTarget: 12, gmPct: 55 }; }

  sliders: (p) => <svg width={p.size||14} height={p.size||14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>,
  refresh: (p) => <svg width={p.size||13} height={p.size||13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>,
  wifi: (p) => <svg width={p.size||14} height={p.size||14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>,
};

// ---- tiny inline bar chart (no chart library needed) ----
function MiniBarChart({ data }) {
  const w = 600, h = 130, padL = 44, padB = 18, padT = 8;
  const vals = data.map((d) => d.value);
  const maxAbs = Math.max(1, ...vals.map((v) => Math.abs(v)));
  const zeroY = padT + (h - padT - padB) * 0.5;
  const scale = (h - padT - padB) / 2 / maxAbs;
  const barW = (w - padL - 10) / data.length - 6;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height: 130 }}>
      <line x1={padL} y1={zeroY} x2={w - 5} y2={zeroY} stroke="#C4B9A0" strokeWidth="1" />
      {data.map((d, i) => {
        const x = padL + i * ((w - padL - 10) / data.length) + 3;
        const barH = Math.abs(d.value) * scale;
        const y = d.value >= 0 ? zeroY - barH : zeroY;
        return (
          <g key={i}>
            <rect x={x} y={y} width={Math.max(barW, 2)} height={Math.max(barH, 1)} fill="#C99A3C" rx="2" />
            <text x={x + barW / 2} y={h - 4} fontSize="9" fill="#8B8F98" textAnchor="middle" fontFamily="IBM Plex Mono, monospace">{d.month}</text>
          </g>
        );
      })}
      <text x={2} y={zeroY + 3} fontSize="9" fill="#8B8F98" fontFamily="IBM Plex Mono, monospace">$0</text>
    </svg>
  );
}

function OTBEngine() {
  const months = useMemo(() => next12Months(), []);
  const [assumptions, setAssumptions] = useState({});
  const [startingBOM, setStartingBOM] = useState({});
  const [data, setData] = useState({});
  const [expandedType, setExpandedType] = useState(null);
  const [monthCursor, setMonthCursor] = useState(0);
  const [scrollStart, setScrollStart] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [filterSelection, setFilterSelection] = useState("all");
  const [groupByCategory, setGroupByCategory] = useState(false);
  const [metric, setMetric] = useState("overUnder");
  const [showImport, setShowImport] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [growthSuggestions, setGrowthSuggestions] = useState({});
  const [suggestionsStatus, setSuggestionsStatus] = useState("");
  const [calculatingSuggestions, setCalculatingSuggestions] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [syncStatus, setSyncStatus] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [importText, setImportText] = useState("");
  const [importPreview, setImportPreview] = useState(null);
  const [importError, setImportError] = useState("");
  const [importFormat, setImportFormat] = useState("generic");
  const [importSummary, setImportSummary] = useState("");
  const fileInputRef = useRef(null);
  const visibleMonths = 6;

  useEffect(() => {
    (async () => {
      let loadedFromServer = false;
      try {
        const res = await fetch("/state").then((r) => r.json());
        if (res.error) throw new Error(res.error);
        if (res.value) {
          const parsed = JSON.parse(res.value);
          setAssumptions(parsed.assumptions || {});
          setStartingBOM(parsed.startingBOM || {});
          setData(parsed.data || {});
          loadedFromServer = true;
        }
      } catch (e) { /* server unreachable or not configured yet - fall through to local copy below */ }
      if (!loadedFromServer) {
        // Nothing on the server yet (new database, or server unreachable) - load whatever this
        // browser has locally. If the server is up, the next autosave will push this data to it.
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            setAssumptions(parsed.assumptions || {});
            setStartingBOM(parsed.startingBOM || {});
            setData(parsed.data || {});
          }
        } catch (e2) { /* first run, nothing anywhere yet */ }
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    const t = setTimeout(async () => {
      const payload = { assumptions, startingBOM, data };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); // always keep a local backup copy too
      } catch (e) { /* ignore quota errors */ }
      try {
        const res = await fetch("/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then((r) => r.json());
        setSaveState(res.ok ? "saved" : "saved locally only");
      } catch (e) { setSaveState("saved locally only"); }
    }, 400);
    return () => clearTimeout(t);
  }, [assumptions, startingBOM, data, loaded]);

  function getAssumptions(cat) { return assumptions[cat] || defaultAssumptions(); }
  function setAssumption(cat, patch) { setAssumptions((prev) => ({ ...prev, [cat]: { ...getAssumptions(cat), ...patch } })); }
  function getRow(type, mKey) { return (data[type] && data[type][mKey]) || emptyRow(); }
  function setRow(type, mKey, patch) {
    setData((prev) => {
      const typeData = { ...(prev[type] || {}) };
      typeData[mKey] = { ...(typeData[mKey] || emptyRow()), ...patch };
      return { ...prev, [type]: typeData };
    });
  }

  function computeSeries(type, cat) {
    const a = getAssumptions(cat);
    const growth = a.growthPct / 100;
    const gm = a.gmPct / 100;
    const wos = a.wosTarget;
    const start = num(startingBOM[type]);

    // Pass 1: forecast sales/COGS per month (independent of the BOM roll-forward chain,
    // so we can look ahead when computing a forward-looking WOS target).
    const forecasts = months.map((mKey) => {
      const row = getRow(type, mKey);
      const forecastSales = num(row.lySales) * (1 + growth);
      const forecastCOGS = forecastSales * (1 - gm);
      return { forecastSales, forecastCOGS };
    });
    const WEEKS_PER_MONTH = 4.33;
    // WOS Target EOM $ at month t = sum of forecasted COGS across the next `wos` weeks,
    // starting at month t, prorating the final partial month. Runs out of data (and
    // understates the target) within `wos` weeks of the end of the visible 12 months.
    function wosTargetAt(t) {
      let weeksLeft = wos, total = 0, idx = t;
      while (weeksLeft > 0 && idx < forecasts.length) {
        const take = Math.min(weeksLeft, WEEKS_PER_MONTH);
        total += forecasts[idx].forecastCOGS * (take / WEEKS_PER_MONTH);
        weeksLeft -= take;
        idx++;
      }
      return total;
    }

    let actualBOMChain = start;
    let prevTargetEOM = null;
    const out = [];
    months.forEach((mKey, t) => {
      const row = getRow(type, mKey);
      const forecastSales = forecasts[t].forecastSales;
      const forecastCOGS = forecasts[t].forecastCOGS;
      const expected = num(row.received) + num(row.balanceToReceive);
      const hasActualsThisMonth = row.actualSales !== "" && row.actualSales !== undefined;
      const actualBOMForThisMonth = t === 0 ? start : actualBOMChain;

      let basis, basisSource;
      if (row.targetBOMOverride !== "" && row.targetBOMOverride !== undefined) { basis = num(row.targetBOMOverride); basisSource = "target override"; }
      else if (row.actualBOMOverride !== "" && row.actualBOMOverride !== undefined) { basis = num(row.actualBOMOverride); basisSource = "actual override"; }
      else if (t === 0) { basis = start; basisSource = "starting BOM"; }
      else if (hasActualsThisMonth) { basis = actualBOMForThisMonth; basisSource = "actual (rolled)"; }
      else { basis = prevTargetEOM; basisSource = "target (rolled)"; }

      const targetEOM = basis + expected - forecastCOGS;
      const wosTargetEOM = wosTargetAt(t);
      const overUnder = wosTargetEOM - targetEOM;
      const buyAction = overUnder > 0 ? "Buy" : overUnder < 0 ? "Don't Buy" : "On Target";

      out.push({ mKey, row, forecastSales, forecastCOGS, expected, basis, basisSource, targetEOM, wosTargetEOM, overUnder, buyAction });
      actualBOMChain = actualBOMForThisMonth - num(row.actualCogs) + num(row.received);
      prevTargetEOM = targetEOM;
    });
    return out;
  }

  const seriesByType = useMemo(() => {
    const m = {};
    TAXONOMY.forEach(([type, cat]) => { m[type] = computeSeries(type, cat); });
    return m;
  }, [data, assumptions, startingBOM, months]);

  const filteredTaxonomy = filterSelection === "all" ? TAXONOMY
    : filterSelection.startsWith("cat:") ? TAXONOMY.filter(([, cat]) => cat === filterSelection.slice(4))
    : TAXONOMY.filter(([type]) => type === filterSelection.slice(5));

  function categoryBuyTotal(cat, monthIdx) {
    return TYPES_BY_CATEGORY[cat].reduce((sum, t) => sum + Math.max(seriesByType[t][monthIdx].overUnder, 0), 0);
  }
  const categoryTotalsThisMonth = useMemo(() => {
    const o = {};
    CATEGORIES.forEach((c) => { o[c] = categoryBuyTotal(c, monthCursor); });
    return o;
  }, [seriesByType, monthCursor]);

  const grandTotalBuy = Object.values(categoryTotalsThisMonth).reduce((a, b) => a + b, 0);
  const grandTotalOverstock = CATEGORIES.reduce((sum, cat) => sum + TYPES_BY_CATEGORY[cat].reduce((s2, t) => s2 + Math.min(seriesByType[t][monthCursor].overUnder, 0), 0), 0);

  const expandedSeries = expandedType ? seriesByType[expandedType] : null;
  const chartData = expandedSeries ? expandedSeries.map((s) => ({ month: monthLabel(s.mKey), value: Math.round(s.overUnder) })) : [];

  function parseAndPreview(text) {
    setImportError("");
    Papa.parse(text.trim(), {
      header: true, skipEmptyLines: true,
      complete: (res) => {
        const cols = res.meta.fields || [];
        const isBOMFormat = cols.some((c) => c.toLowerCase().includes("shopify product type")) && cols.some((c) => c.toLowerCase().includes("beginning inv"));
        if (isBOMFormat) {
          setImportFormat("bom");
          setImportPreview(res.data.slice(0, 5000));
          return;
        }
        const isPOFormat = cols.includes("Product Type") && cols.includes("Total Cost Ordered") && cols.includes("Total Cost Received");
        if (isPOFormat) {
          setImportFormat("po");
          setImportPreview(res.data.slice(0, 5000));
          return;
        }
        setImportFormat("generic");
        const required = ["Product Type", "Month"];
        const missing = required.filter((r) => !cols.includes(r));
        if (missing.length) { setImportError(`Missing required column(s): ${missing.join(", ")}. (For a PO/receiving export, include "Total Cost Ordered" and "Total Cost Received" columns instead.)`); setImportPreview(null); return; }
        setImportPreview(res.data.slice(0, 2000));
      },
      error: (err) => { setImportError("Could not parse that CSV: " + err.message); setImportPreview(null); },
    });
  }
  const MONTH_NAMES = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseMonthToKey(raw) {
    const s = (raw || "").trim();
    if (/^\d{4}-\d{1,2}$/.test(s)) { const [y, m] = s.split("-"); return `${y}-${m.padStart(2, "0")}`; }
    let m = s.match(/^([A-Za-z]{3,9})[\s\-\/]?'?(\d{2,4})$/); // "Jul-26", "Jul 2026", "July/26"
    if (m) {
      const mon = MONTH_NAMES[m[1].slice(0, 3).toLowerCase()];
      if (mon) { let yr = m[2]; if (yr.length === 2) yr = (Number(yr) < 50 ? "20" : "19") + yr; return `${yr}-${String(mon).padStart(2, "0")}`; }
    }
    m = s.match(/^'?(\d{2,4})[\s\-\/]([A-Za-z]{3,9})$/); // "26-Jul", "2026 Jul"
    if (m) {
      const mon = MONTH_NAMES[m[2].slice(0, 3).toLowerCase()];
      if (mon) { let yr = m[1]; if (yr.length === 2) yr = (Number(yr) < 50 ? "20" : "19") + yr; return `${yr}-${String(mon).padStart(2, "0")}`; }
    }
    m = s.match(/^(\d{1,2})[\/\-](\d{4})$/); // "07/2026" or "07-2026"
    if (m) return `${m[2]}-${m[1].padStart(2, "0")}`;
    return s; // unrecognized - left as-is, row simply won't match a real month column
  }
  function applyImport() {
    if (!importPreview) return;
    if (importFormat === "po") { applyPOImport(); return; }
    if (importFormat === "bom") { applyBOMImport(); return; }
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    setData((prev) => {
      const next = { ...prev };
      importPreview.forEach((r) => {
        const typeName = (r["Product Type"] || "").trim();
        const mRaw = (r["Month"] || "").trim();
        if (!typeName || !mRaw || !validTypes.has(typeName.toLowerCase())) return;
        const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
        let mKey = parseMonthToKey(mRaw);
        const typeData = { ...(next[match] || {}) };
        const existing = typeData[mKey] || emptyRow();
        const patch = {};
        const map = { "LY Sales": "lySales", "LY COGS": "lyCogs", "Actual Sales": "actualSales", "Actual COGS": "actualCogs", "Received": "received", "Balance to Receive": "balanceToReceive", "Target BOM Override": "targetBOMOverride", "Actual BOM Override": "actualBOMOverride" };
        Object.entries(map).forEach(([col, key]) => { if (r[col] !== undefined && r[col] !== "") patch[key] = Number(r[col]); });
        typeData[mKey] = { ...existing, ...patch };
        next[match] = typeData;
      });
      return next;
    });
    setShowImport(false); setImportText(""); setImportPreview(null);
  }
  // Aggregates a line-item PO/receiving export (Product Type, Expected Date, Received Date,
  // Total Cost Ordered, Total Cost Received) into Received $ / Balance to Receive $ per
  // product type per month. Re-importing overwrites those two fields with freshly computed
  // totals for that type+month (not additive), so it's safe to re-run with an updated export.
  function applyPOImport() {
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    const monthOf = (dateStr) => { const s = (dateStr || "").trim(); return /^\d{4}-\d{2}/.test(s) ? s.slice(0, 7) : null; };
    const totals = {}; // type -> month -> { received, balance }
    let matchedRows = 0;
    importPreview.forEach((r) => {
      const typeName = (r["Product Type"] || "").trim();
      if (!typeName || !validTypes.has(typeName.toLowerCase())) return;
      const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
      const ordered = Number(r["Total Cost Ordered"]) || 0;
      const received = Number(r["Total Cost Received"]) || 0;
      const balance = Math.max(0, ordered - received);
      const receivedMonth = monthOf(r["Received Date"]);
      const expectedMonth = monthOf(r["Expected Date"]) || receivedMonth || months[monthCursor];
      matchedRows++;
      totals[match] = totals[match] || {};
      if (received > 0 && receivedMonth) {
        totals[match][receivedMonth] = totals[match][receivedMonth] || { received: 0, balance: 0 };
        totals[match][receivedMonth].received += received;
      }
      if (balance > 0.005) {
        totals[match][expectedMonth] = totals[match][expectedMonth] || { received: 0, balance: 0 };
        totals[match][expectedMonth].balance += balance;
      }
    });
    setData((prev) => {
      const next = { ...prev };
      Object.entries(totals).forEach(([type, byMonth]) => {
        const typeData = { ...(next[type] || {}) };
        Object.entries(byMonth).forEach(([mKey, vals]) => {
          const existing = typeData[mKey] || emptyRow();
          typeData[mKey] = { ...existing, received: Number(vals.received.toFixed(2)), balanceToReceive: Number(vals.balance.toFixed(2)) };
        });
        next[type] = typeData;
      });
      return next;
    });
    setImportSummary(`Applied ${matchedRows} line items across ${Object.keys(totals).length} product types.`);
    setShowImport(false); setImportText(""); setImportPreview(null);
  }
  // Applies a "Beginning Inv $" / starting BOM template (Planning Category, Shopify Product
  // Type, Plan Month, Beginning Inv $) as each product type's Starting Actual BOM $.
  function applyBOMImport() {
    const validTypes = new Set(TAXONOMY.map((t) => t[0].toLowerCase()));
    const typeCol = Object.keys(importPreview[0] || {}).find((c) => c.toLowerCase().includes("shopify product type"));
    const invCol = Object.keys(importPreview[0] || {}).find((c) => c.toLowerCase().includes("beginning inv"));
    let matched = 0;
    const updates = {};
    importPreview.forEach((r) => {
      const typeName = (r[typeCol] || "").trim();
      if (!typeName || !validTypes.has(typeName.toLowerCase())) return;
      const match = TAXONOMY.find((t) => t[0].toLowerCase() === typeName.toLowerCase())[0];
      const val = Number(String(r[invCol]).replace(/[^0-9.\-]/g, "")) || 0;
      updates[match] = val;
      matched++;
    });
    setStartingBOM((prev) => ({ ...prev, ...updates }));
    setImportSummary(`Set starting BOM for ${matched} product types.`);
    setShowImport(false); setImportText(""); setImportPreview(null);
  }

  async function syncSales() {
    setSyncing(true);
    setSyncStatus(`Syncing sales & COGS for ${monthLabel(months[monthCursor])}…`);
    try {
      const mStr = months[monthCursor];
      const [y, m] = mStr.split("-").map(Number);
      const lastDay = new Date(y, m, 0).getDate();
      const start = `${mStr}-01`;
      const end = `${mStr}-${String(lastDay).padStart(2, "0")}`;
      const lyStart = `${y - 1}-${String(m).padStart(2, "0")}-01`;
      const lyEnd = `${y - 1}-${String(m).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
      const [cur, ly] = await Promise.all([
        fetch(`/sales-by-type?start=${start}&end=${end}`).then((r) => r.json()),
        fetch(`/sales-by-type?start=${lyStart}&end=${lyEnd}`).then((r) => r.json()),
      ]);
      if (cur.error) throw new Error(cur.error);
      if (ly.error) throw new Error(ly.error);
      let matched = 0;
      TAXONOMY.forEach(([type]) => {
        const c = cur.totals?.[type];
        const l = ly.totals?.[type];
        if (!c && !l) return;
        matched++;
        const patch = {};
        if (c) { patch.actualSales = Number(c.sales.toFixed(2)); patch.actualCogs = Number(c.cogs.toFixed(2)); }
        if (l) { patch.lySales = Number(l.sales.toFixed(2)); patch.lyCogs = Number(l.cogs.toFixed(2)); }
        setRow(type, mStr, patch);
      });
      setSyncStatus(`Synced ${matched} of ${TAXONOMY.length} product types for ${monthLabel(mStr)}.`);
    } catch (e) { setSyncStatus("Sync failed: " + e.message); }
    setSyncing(false);
  }

    setSyncing(true);

  // Suggests a Growth % per category based on the last 3 completed calendar months'
  // actual sales vs. the same 3 months a year earlier - a data-driven starting point
  // instead of guessing, using sales data already flowing through the live sync.
  async function calculateGrowthSuggestions() {
    setCalculatingSuggestions(true);
    setSuggestionsStatus("Calculating from trailing 3 months of actual sales…");
    try {
      const now = new Date();
      now.setDate(1);
      const trailingMonths = [];
      for (let i = 3; i >= 1; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        trailingMonths.push(d);
      }
      async function sumSalesForMonths(dates) {
        const results = await Promise.all(dates.map((d) => {
          const y = d.getFullYear(), m = d.getMonth() + 1;
          const lastDay = new Date(y, m, 0).getDate();
          const start = `${y}-${String(m).padStart(2, "0")}-01`;
          const end = `${y}-${String(m).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
          return fetch(`/sales-by-type?start=${start}&end=${end}`).then((r) => r.json());
        }));
        const byType = {};
        results.forEach((res) => {
          if (res.error) throw new Error(res.error);
          Object.entries(res.totals || {}).forEach(([type, t]) => {
            byType[type] = (byType[type] || 0) + t.sales;
          });
        });
        return byType;
      }
      const lyMonths = trailingMonths.map((d) => new Date(d.getFullYear() - 1, d.getMonth(), 1));
      const [thisYear, lastYear] = await Promise.all([sumSalesForMonths(trailingMonths), sumSalesForMonths(lyMonths)]);

      const catThis = {}, catLast = {};
      TAXONOMY.forEach(([type, cat]) => {
        catThis[cat] = (catThis[cat] || 0) + (thisYear[type] || 0);
        catLast[cat] = (catLast[cat] || 0) + (lastYear[type] || 0);
      });
      const suggestions = {};
      CATEGORIES.forEach((cat) => {
        if (catLast[cat] > 0) suggestions[cat] = Math.round(((catThis[cat] / catLast[cat]) - 1) * 1000) / 10;
      });
      setGrowthSuggestions(suggestions);
      setSuggestionsStatus(`Done - based on ${monthLabel(`${trailingMonths[0].getFullYear()}-${String(trailingMonths[0].getMonth()+1).padStart(2,"0")}`)} through ${monthLabel(`${trailingMonths[2].getFullYear()}-${String(trailingMonths[2].getMonth()+1).padStart(2,"0")}`)} vs the same months last year.`);
    } catch (e) {
      setSuggestionsStatus("Could not calculate: " + e.message);
    }
    setCalculatingSuggestions(false);
  }

                    const allTypes = filteredTaxonomy.map(([t]) => t);
                    const v = sumMetricForTypes(allTypes, i);
                    if (v === null) return <td key={i} className="text-right py-2 px-3" style={{ color: "#B0B4BC" }}>—</td>;
                    const cellColor = metric === "overUnder" ? (v > 0 ? "#5B7A5B" : v < 0 ? "#B5432D" : "#20232B") : (v < 0 ? "#B5432D" : "#20232B");
                    return <td key={i} className="text-right py-2 px-3" style={{ color: cellColor, fontWeight: 700 }}>{money(v)}</td>;
                  })}
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div className="mt-4 flex items-start gap-2 text-xs" style={{ color: "#8B8F98" }}>
          <Icon.info />
          <span>
            Target EOM $ = BOM $ + Expected receipts − Forecast COGS. BOM $ auto-rolls from actual COGS/receipts while actual sales are entered; once a month has no actual sales yet, it automatically switches to rolling forward from the prior month's Target EOM. WOS Target EOM $ = sum of forecasted COGS across the next N weeks (your WOS target) starting that month, prorated for partial months — a forward-looking target, not a single-month rate extrapolation, so it responds to seasonality. It understates near the end of the visible 12 months since there's no forecast data beyond that window to sum. Over/Under $ = WOS Target EOM − Target EOM. Positive = Buy. Click any row to open its full monthly ledger and edit inputs.
          </span>
        </div>
      </div>

      {showSync && (
        <Modal onClose={() => setShowSync(false)} title="Live sync from Shopify">
          <p className="text-sm mb-3" style={{ color: "#5C6270" }}>
            This page is served directly by your Shopify proxy, so sync talks to it automatically - no URL to paste. Pulls Actual Sales, Actual COGS, LY Sales/COGS, and current inventory value. Received $ and Balance to Receive $ still need to be entered by hand.
          </p>
          <div className="flex gap-2 mb-3">
            <button onClick={testConnection} className="text-xs px-3 py-1.5 rounded" style={{ background: "#E6E1D6" }}>Test connection</button>
          </div>
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>Sales & COGS sync into: <b>{monthLabel(months[monthCursor])}</b> (change with the dashboard arrows). Inventory sync always sets your Starting Actual BOM $, regardless of month shown.</div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={syncSales} disabled={syncing} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
                <Icon.refresh /> Sync Sales & COGS
              </button>
              <button onClick={syncInventory} disabled={syncing} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
                <Icon.refresh /> Sync Inventory
              </button>
            </div>
          </div>
          <div className="p-3 rounded mb-3" style={{ background: "#FBF6EA" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>If Inventory sync was run earlier while viewing a future month, it may have left stray $0 (or other) overrides sitting in "Actual BOM $ (override)" for months after July. This clears those out (leaves July's Starting BOM untouched) so those months roll forward normally again.</div>
            <button onClick={clearStrayBOMOverrides} className="text-xs px-3 py-2 rounded flex items-center gap-1.5" style={{ background: "#B5432D", color: "#FBF6EA" }}>
              Clear stray BOM overrides (Aug onward)
            </button>
          </div>
          {syncStatus && <div className="text-xs" style={{ color: syncStatus.startsWith("Sync failed") || syncStatus.startsWith("Could not") ? "#B5432D" : "#5B7A5B" }}>{syncStatus}</div>}
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowSync(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showSettings && (
        <Modal onClose={() => setShowSettings(false)} title="Category assumptions">
          <div className="p-3 rounded mb-3" style={{ background: "#F1EEE6" }}>
            <div className="text-xs mb-2" style={{ color: "#5C6270" }}>Suggests a Growth % per category from your actual trailing 3 months of sales vs. the same 3 months last year - a data-driven starting point instead of a guess.</div>
            <button onClick={calculateGrowthSuggestions} disabled={calculatingSuggestions} className="text-xs px-3 py-2 rounded flex items-center gap-1.5 disabled:opacity-50" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.refresh /> {calculatingSuggestions ? "Calculating…" : "Calculate suggested growth %"}
            </button>
            {suggestionsStatus && <div className="text-xs mt-2" style={{ color: suggestionsStatus.startsWith("Could not") ? "#B5432D" : "#5B7A5B" }}>{suggestionsStatus}</div>}
          </div>
          <div className="space-y-2 max-h-96 overflow-y-auto">
            {CATEGORIES.map((c) => {
              const a = getAssumptions(c);
              const suggestion = growthSuggestions[c];
              return (
                <div key={c} className="flex items-center gap-2 p-2 rounded border text-xs flex-wrap" style={{ borderColor: "#DCD5C4" }}>
                  <span style={{ width: 9, height: 9, borderRadius: 2, background: CATEGORY_COLOR[c], flexShrink: 0 }} />
                  <span className="flex-1 min-w-[140px]" style={{ fontWeight: 500 }}>{c}</span>
                  <label className="flex items-center gap-1">Growth % <input type="number" value={a.growthPct} onChange={(e) => setAssumption(c, { growthPct: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                  {suggestion !== undefined && (
                    <button onClick={() => setAssumption(c, { growthPct: suggestion })} className="px-2 py-1 rounded text-[10px]" style={{ background: "#FBF6EA", color: "#8C6E4A", fontWeight: 600 }} title="Click to apply this suggestion">
                      Suggested: {suggestion > 0 ? "+" : ""}{suggestion}%
                    </button>
                  )}
                  <label className="flex items-center gap-1">WOS <input type="number" value={a.wosTarget} onChange={(e) => setAssumption(c, { wosTarget: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                  <label className="flex items-center gap-1">GM % <input type="number" value={a.gmPct} onChange={(e) => setAssumption(c, { gmPct: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" style={{ borderColor: "#DCD5C4" }} /></label>
                </div>
              );
            })}
          </div>
          <div className="flex justify-end mt-4">
            <button onClick={() => setShowSettings(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>Done</button>
          </div>
        </Modal>
      )}

      {showImport && (
        <Modal onClose={() => { setShowImport(false); setImportPreview(null); setImportError(""); }} title="Import from CSV">
          <p className="text-sm mb-2" style={{ color: "#5C6270" }}>Two formats are auto-detected from the column headers:</p>
          <div className="text-xs mb-2 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Actuals/plan:</b> Product Type, Month, LY Sales, LY COGS, Actual Sales, Actual COGS, Received, Balance to Receive
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>PO/receiving export</b> (e.g. from your "PO Export" Sidekick app): Product Type, Expected Date, Received Date, Total Cost Ordered, Total Cost Received — this one auto-fills Received $ and Balance to Receive $ by month.
          </div>
          <div className="text-xs mb-3 p-2 rounded" style={{ background: "#F1EEE6", fontFamily: "'IBM Plex Mono', monospace" }}>
            <b>Starting BOM template:</b> Planning Category, Shopify Product Type, Plan Month, Beginning Inv $ — sets each product type's Starting Actual BOM $.
          </div>
          {importSummary && <div className="text-xs mb-3 p-2 rounded" style={{ background: "#EDF3EA", color: "#5B7A5B" }}>{importSummary}</div>}
          <div className="flex gap-2 mb-3">
            <button onClick={() => fileInputRef.current?.click()} className="text-xs px-3 py-1.5 rounded flex items-center gap-1" style={{ background: "#20232B", color: "#F1EEE6" }}>
              <Icon.upload /> Upload CSV file
            </button>
            <input ref={fileInputRef} type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
          </div>
          <textarea value={importText} onChange={(e) => { setImportText(e.target.value); parseAndPreview(e.target.value); }} placeholder="Paste CSV here, or upload a file above" className="w-full h-24 text-xs p-2 rounded border font-mono" style={{ borderColor: "#DCD5C4" }} />
          {importError && <div className="text-xs mt-2" style={{ color: "#B5432D" }}>{importError}</div>}
          {importPreview && (
            <div className="mt-3 text-xs max-h-40 overflow-y-auto border rounded p-2" style={{ borderColor: "#DCD5C4" }}>
              <div className="mb-1" style={{ color: "#8C6E4A", fontWeight: 600 }}>Detected format: {importFormat === "po" ? "PO/receiving export" : importFormat === "bom" ? "Starting BOM template" : "Actuals/plan"} ({importPreview.length} rows)</div>
              {importPreview.slice(0, 8).map((r, i) => (
                <div key={i} style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                  {importFormat === "po"
                    ? `${r["Product Type"]} · ordered ${r["Total Cost Ordered"]} · received ${r["Total Cost Received"]}`
                    : importFormat === "bom"
                    ? `${r[Object.keys(r).find((c) => c.toLowerCase().includes("shopify product type"))]} · ${r[Object.keys(r).find((c) => c.toLowerCase().includes("beginning inv"))]}`
                    : `${r["Product Type"]} · ${r["Month"]} · LY Sales ${r["LY Sales"] ?? "—"} · LY COGS ${r["LY COGS"] ?? "—"}`}
                </div>
              ))}
              {importPreview.length > 8 && <div style={{ color: "#8B8F98" }}>…and {importPreview.length - 8} more rows</div>}
            </div>
          )}
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setShowImport(false)} className="text-xs px-3 py-2 rounded" style={{ background: "#E6E1D6" }}>Cancel</button>
            <button onClick={applyImport} disabled={!importPreview} className="text-xs px-3 py-2 rounded flex items-center gap-1 disabled:opacity-40" style={{ background: "#C99A3C", color: "#20232B", fontWeight: 600 }}>
              <Icon.check /> Apply import
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function TypeDetail({ type, months, series, scrollStart, setScrollStart, visibleMonths, getRow, setRow, startingBOM, setStartingBOM, chartData }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <div style={{ fontFamily: "'Roboto Slab', serif" }} className="text-sm font-bold">{type}</div>
        <label className="text-xs flex items-center gap-1.5">
          Starting Actual BOM $
          <input type="number" value={startingBOM ?? 0} onChange={(e) => setStartingBOM(Number(e.target.value))} className="w-24 border rounded px-1.5 py-1" style={{ borderColor: "#DCD5C4" }} />
        </label>
      </div>
      <div className="mb-3"><MiniBarChart data={chartData} /></div>
      <div className="flex items-center justify-between mb-1">
        <button onClick={() => setScrollStart((s) => Math.max(0, s - 1))} disabled={scrollStart === 0} className="p-1 rounded disabled:opacity-30" style={{ background: "#F1EEE6" }}><Icon.chevronLeft /></button>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-xs text-[#8B8F98]">{monthLabel(months[scrollStart])} – {monthLabel(months[Math.min(scrollStart + visibleMonths - 1, 11)])}</span>
        <button onClick={() => setScrollStart((s) => Math.min(months.length - visibleMonths, s + 1))} disabled={scrollStart >= months.length - visibleMonths} className="p-1 rounded disabled:opacity-30" style={{ background: "#F1EEE6" }}><Icon.chevronRight /></button>
      </div>
      <div className="overflow-x-auto">
        <table style={{ borderCollapse: "collapse", fontFamily: "'IBM Plex Mono', monospace" }} className="w-full text-xs">
          <thead>
            <tr>
              <th className="text-left py-1.5 pr-3" style={{ color: "#8B8F98", minWidth: 150 }}>Line</th>
              {months.slice(scrollStart, scrollStart + visibleMonths).map((m) => (<th key={m} className="text-right py-1.5 px-2" style={{ minWidth: 95 }}>{monthLabel(m)}</th>))}
            </tr>
          </thead>
          <tbody>
            {INPUT_FIELDS.map((f) => (
              <tr key={f.key}>
                <td className="py-1 pr-3" style={{ color: f.muted ? "#B0B4BC" : "#5C6270" }}>{f.label}</td>
                {months.slice(scrollStart, scrollStart + visibleMonths).map((m) => {
                  const row = getRow(type, m);
                  return (
                    <td key={m} className="py-1 px-1">
                      <input type="number" value={row[f.key]} placeholder={f.muted ? "—" : "0"} onChange={(e) => setRow(type, m, { [f.key]: e.target.value === "" ? "" : Number(e.target.value) })} className="w-full text-right px-1 py-1 rounded border text-xs" style={{ borderColor: "#E6E1D6", color: f.muted ? "#8B8F98" : "#20232B" }} onClick={(e) => e.stopPropagation()} />
                    </td>
                  );
                })}
              </tr>
            ))}
            <ReadRow label="Forecast Sales $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.forecastSales} />
            <ReadRow label="Forecast COGS $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.forecastCOGS} />
            <ReadRow label="BOM $ used" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.basis} sub={(s) => s.basisSource} />
            <ReadRow label="Expected $ (recv+open PO)" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.expected} />
            <ReadRow label="Target EOM $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.targetEOM} bold />
            <ReadRow label="WOS Target EOM $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.wosTargetEOM} />
            <ReadRow label="Over/Under $" series={series} scrollStart={scrollStart} visibleMonths={visibleMonths} get={(s) => s.overUnder} highlight signed />
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ReadRow({ label, series, scrollStart, visibleMonths, get, sub, bold, highlight, signed }) {
  return (
    <tr style={highlight ? { background: "#FBF6EA" } : {}}>
      <td className="py-1 pr-3" style={{ color: "#20232B", fontWeight: bold || highlight ? 700 : 500 }}>{label}</td>
      {series.slice(scrollStart, scrollStart + visibleMonths).map((s, i) => {
        const v = get(s);
        const color = signed ? (v > 0 ? "#5B7A5B" : v < 0 ? "#B5432D" : "#20232B") : (v < 0 ? "#B5432D" : "#20232B");
        return (
          <td key={i} className="py-1 px-2 text-right" style={{ fontWeight: bold || highlight ? 700 : 400, color }}>
            {money(v)}
            {sub && <div style={{ fontSize: 9, color: "#B0B4BC", fontWeight: 400 }}>{sub(s)}</div>}
          </td>
        );
      })}
    </tr>
  );
}

function Modal({ children, onClose, title }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(27,32,39,0.6)" }}>
      <div className="w-full max-w-lg rounded-md p-5 max-h-[90vh] overflow-y-auto" style={{ background: "#FFFFFF" }}>
        <div className="flex items-center justify-between mb-3">
          <div style={{ fontFamily: "'Roboto Slab', serif" }} className="font-bold text-lg">{title}</div>
          <button onClick={onClose}><Icon.x /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<OTBEngine />);
</script>
</body>
</html>
